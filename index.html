/strong>, posibilidad o duda.<\/p>\n<p><a id=\"lecturas\"><\/a><\/p>\n<h2>11. Lectura comentada de ejemplos completos<\/h2>\n<p>Estos análisis reúnen contenidos ya explicados. Las segmentaciones son selectivas: se separa lo que se está estudiando sin atribuir un significado nuevo a cada sílaba.<\/p>\n<h3>11.1. Lugar, posesión y compañía<\/h3>\n<blockquote>\n<p><strong>Wayqey kay llaqtapi mamaywan tiyan.<\/strong><br />\n<strong>PDF:<\/strong> Mi hermano vive en este pueblo con mi mamá.<br />\n<a href=\"#fuente-04\">C04, pp. 4, 14<\/a>.<\/p>\n<\/blockquote>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Elemento<\/th>\n  <th>Lectura<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>wayqey<\/code><\/td>\n  <td>Mi hermano; sujeto de la traducción.<\/td>\n<\/tr>\n<tr>\n  <td><code>kay llaqta-pi<\/code><\/td>\n  <td>En este pueblo; lugar.<\/td>\n<\/tr>\n<tr>\n  <td><code>mama-y-wan<\/code><\/td>\n  <td>Con mi mamá; posesión más compañía.<\/td>\n<\/tr>\n<tr>\n  <td><code>tiyan<\/code><\/td>\n  <td>Vive; verbo al final.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>No se deben traducir <code>-pi<\/code> y <code>-wan<\/code> como palabras aisladas sin reconocer a qué base se añaden.<\/p>\n<h3>11.2. Beneficiario, cualidad, objeto y futuro<\/h3>\n<blockquote>\n<p><strong>Noqa warmiypaq munay wasita rantisaq.<\/strong><br />\n<strong>PDF:<\/strong> Yo voy a comprar una hermosa casa para mi mujer.<br />\n<a href=\"#fuente-04\">C04, p. 14<\/a>.<\/p>\n<\/blockquote>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Elemento<\/th>\n  <th>Lectura<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>noqa<\/code><\/td>\n  <td>Yo.<\/td>\n<\/tr>\n<tr>\n  <td><code>warmi-y-paq<\/code><\/td>\n  <td>Para mi esposa; beneficiaria.<\/td>\n<\/tr>\n<tr>\n  <td><code>munay wasi-ta<\/code><\/td>\n  <td>Una hermosa casa; cualidad antes del sustantivo y marca de objeto.<\/td>\n<\/tr>\n<tr>\n  <td><code>rantisaq<\/code><\/td>\n  <td>Compraré; forma de primera persona futura usada en la traducción de clase.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>La traducción española reorganiza el orden. El grupo «para mi mujer» no tiene que aparecer al final en quechua.<\/p>\n<h3>11.3. Tema y afirmación<\/h3>\n<blockquote>\n<p><strong>Juanqa yachachiqmi.<\/strong><br />\n<strong>Guía:<\/strong> Juan es profesor.<br />\n<a href=\"#fuente-05\">C05, p. 4<\/a>.<\/p>\n<\/blockquote>\n<p><code>Juan-qa<\/code> presenta a la persona de la que se habla; <code>yachachiq-mi<\/code> afirma la información sobre ella. La oración no tiene por qué contener una palabra separada que corresponda a cada palabra de la traducción española.<\/p>\n<h3>11.4. Tema, negación y futuro<\/h3>\n<blockquote>\n<p><strong>Noqaqa manan hamusaqchu.<\/strong><br />\n<strong>Guía:<\/strong> Yo no vendré.<br />\n<a href=\"#fuente-05\">C05, p. 4<\/a>.<\/p>\n<\/blockquote>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Elemento<\/th>\n  <th>Lectura<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>noqa-qa<\/code><\/td>\n  <td>Yo, como tema.<\/td>\n<\/tr>\n<tr>\n  <td><code>mana-n<\/code><\/td>\n  <td>Negación con la marca afirmativa que usa el material.<\/td>\n<\/tr>\n<tr>\n  <td><code>hamusaq-chu<\/code><\/td>\n  <td>La forma futura queda dentro de la construcción negativa con <code>-chu<\/code>.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Esta lectura combina la explicación de <code>-qa<\/code>, <code>-n/-mi<\/code> y <code>-chu<\/code>. No debe interpretarse como «yo es no es vendré».<\/p>\n<h3>11.5. Diminutivo, compañía y acción en curso<\/h3>\n<blockquote>\n<p><strong>Haqay wallpacha michichawan pukllashan.<\/strong><br />\n<strong>Guía:<\/strong> Aquella gallinita está jugando con el gatito.<br />\n<a href=\"#fuente-05\">C05, p. 13<\/a>.<\/p>\n<\/blockquote>\n<p>Se reconocen <code>wallpa-cha<\/code>, gallinita, y <code>michi-cha-wan<\/code>, con el gatito. La traducción de <code>pukllashan<\/code> se da por el contexto de la oración; el material usa formas de acción en curso, pero no presenta un cuadro completo del progresivo.<\/p>\n<p><a id=\"dialogo\"><\/a><\/p>\n<h2>12. El diálogo de presentación como repaso<\/h2>\n<p>La conversación de la clase 2 permite ver varios recursos dentro de preguntas y respuestas. Las traducciones siguientes son las del PDF, con redacción española ajustada. La última columna relaciona el diálogo con los temas de esta guía; no convierte cada terminación del diálogo en un nuevo tema desarrollado. <a href=\"#fuente-02\">C02, p. 3<\/a>.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Pregunta o expresión de clase<\/th>\n  <th>Respuesta o continuación de clase<\/th>\n  <th>Español del PDF<\/th>\n  <th>Qué se puede observar<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>Maymantan kanki?<\/code><\/td>\n  <td><code>Antamanta<\/code><\/td>\n  <td>¿De dónde eres? - De Anta.<\/td>\n  <td>Procedencia con <code>-manta<\/code>.<\/td>\n<\/tr>\n<tr>\n  <td><code>Piwanmi tiyanki?<\/code><\/td>\n  <td><code>Taytamamaywan<\/code><\/td>\n  <td>¿Con quién vives? - Con mis padres.<\/td>\n  <td>Compañía con <code>-wan<\/code>.<\/td>\n<\/tr>\n<tr>\n  <td><code>Piwanmi tiyanki?<\/code><\/td>\n  <td><code>Qoyaywan<\/code> / <code>sapallay<\/code><\/td>\n  <td>Con mi esposa / vivo solo.<\/td>\n  <td>Compañía; respuesta alternativa con <code>-lla<\/code>.<\/td>\n<\/tr>\n<tr>\n  <td><code>Iman sutiyki?<\/code><\/td>\n  <td><code>Sutiyqa Ronalmi<\/code><\/td>\n  <td>¿Cuál es tu nombre? - Mi nombre es Ronald.<\/td>\n  <td>Posesión en <code>suti-yki<\/code>, <code>suti-y<\/code>; el PDF escribe <code>Ronalmi<\/code>.<\/td>\n<\/tr>\n<tr>\n  <td><code>Haykuy, tiyaykuy<\/code><\/td>\n  <td>-<\/td>\n  <td>Pasa, toma asiento.<\/td>\n  <td>Formas de invitación; no se da su conjugación completa.<\/td>\n<\/tr>\n<tr>\n  <td><code>Taytayta reqsichisqayki<\/code><\/td>\n  <td><code>Reqsichiway<\/code><\/td>\n  <td>Te presento a mi padre - Preséntame, hazme conocer.<\/td>\n  <td><code>tayta-y-ta<\/code>: posesión más objeto; <code>-wa-<\/code> dentro del verbo.<\/td>\n<\/tr>\n<tr>\n  <td><code>Mamayta reqsichisqayki<\/code><\/td>\n  <td><code>Reqsichiway<\/code><\/td>\n  <td>Te presento a mi madre - Preséntame.<\/td>\n  <td><code>mama-y-ta<\/code>: posesión más objeto.<\/td>\n<\/tr>\n<tr>\n  <td><code>Kanchu wayqeykikuna?<\/code><\/td>\n  <td><code>Arí, kanmi iskay<\/code><\/td>\n  <td>¿Tienes hermanos? - Sí, tengo dos.<\/td>\n  <td>Interrogación con <code>-chu<\/code>; plural <code>-kuna<\/code>.<\/td>\n<\/tr>\n<tr>\n  <td><code>Kanchu panaykikuna?<\/code><\/td>\n  <td><code>Manan<\/code> / <code>manan kanchu<\/code><\/td>\n  <td>¿Tienes hermanas? - No / no tengo.<\/td>\n  <td>Negación con <code>mana<\/code> y <code>-chu<\/code> en la respuesta completa.<\/td>\n<\/tr>\n<tr>\n  <td>-<\/td>\n  <td><code>Arí kanmi wayqeypas panaypas<\/code><\/td>\n  <td>Sí, tengo hermanos y hermanas.<\/td>\n  <td><code>-pas<\/code> aparece en nombres; otro motivo para no limitarlo a verbos.<\/td>\n<\/tr>\n<tr>\n  <td><code>Hayk'an watayki?<\/code><\/td>\n  <td><code>Kinsa chunka kinsayoq<\/code><\/td>\n  <td>¿Cuántos años tienes? - 33 años.<\/td>\n  <td>Expresión de edad; la clase escribe <code>-yoq<\/code> en esta respuesta.<\/td>\n<\/tr>\n<tr>\n  <td><code>Tayta mamayki kausanchu?<\/code><\/td>\n  <td><code>Arí<\/code><\/td>\n  <td>¿Viven tus padres? - Sí.<\/td>\n  <td>Pregunta con <code>-chu<\/code>.<\/td>\n<\/tr>\n<tr>\n  <td><code>Ima k'itipin tiyanki?<\/code><\/td>\n  <td><code>San Sebastian k'itipi<\/code><\/td>\n  <td>¿En qué lugar vives? - En San Sebastián.<\/td>\n  <td>Lugar con <code>-pi<\/code>; en la pregunta aparece seguido de <code>-n<\/code>.<\/td>\n<\/tr>\n<tr>\n  <td><code>May wamanipin tiyanki?<\/code><\/td>\n  <td><code>Qosqo wamanipi<\/code><\/td>\n  <td>¿En qué provincia vives? - En la provincia de Cusco.<\/td>\n  <td>Localización; <code>wamani<\/code> en el contexto de provincia.<\/td>\n<\/tr>\n<tr>\n  <td><code>Ima k'ijllupin tiyanki?<\/code><\/td>\n  <td><code>Lloq'e Yupanki k'ijllupi<\/code><\/td>\n  <td>¿En qué calle vives? - En la calle Lloque Yupanki.<\/td>\n  <td>Localización; <code>k'ijllu-pi<\/code>.<\/td>\n<\/tr>\n<tr>\n  <td><code>Imatan qan munawaq?<\/code><\/td>\n  <td><code>Qhali kayta, mikhuyta, takiyta, tusuyta<\/code><\/td>\n  <td>¿Qué te gustaría? - Estar sano, comer, cantar, bailar.<\/td>\n  <td>Acciones como complemento; varias formas en <code>-y-ta<\/code>.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>La pregunta con <code>munawaq<\/code> introduce un valor de deseo o posibilidad en el diálogo, pero los PDF no presentan su paradigma. Se conserva el ejemplo sin añadir una conjugación del condicional.<\/p>\n<p><a id=\"indice-formas\"><\/a><\/p>\n<h2>13. Índice rápido de formas gramaticales<\/h2>\n<p>Este índice remite a las explicaciones; no sustituye las diferencias de contexto. Una misma secuencia gráfica puede tener funciones distintas.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Forma<\/th>\n  <th>Función trabajada<\/th>\n  <th>Consultar<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>-y<\/code> en <code>llank'ay<\/code><\/td>\n  <td>Terminación del infinitivo del modelo.<\/td>\n  <td><a href=\"#verbos\">Verbos<\/a>.<\/td>\n<\/tr>\n<tr>\n  <td><code>-ni, -nki, -n, -nchis, -yku, -nkichis, -nku<\/code><\/td>\n  <td>Terminaciones personales del presente de <code>llank'ay<\/code>.<\/td>\n  <td><a href=\"#verbos\">Conjugación<\/a>.<\/td>\n<\/tr>\n<tr>\n  <td><code>-ra-<\/code><\/td>\n  <td>Pasado en el paradigma de clase.<\/td>\n  <td><a href=\"#verbos\">Conjugación<\/a>.<\/td>\n<\/tr>\n<tr>\n  <td><code>-saq, -nqa, -sunchis/-sun, -saqku, -nqaku<\/code><\/td>\n  <td>Formas del futuro; segunda persona coincide con presente.<\/td>\n  <td><a href=\"#verbos\">Conjugación<\/a>.<\/td>\n<\/tr>\n<tr>\n  <td><code>-kuna<\/code><\/td>\n  <td>Plural nominal.<\/td>\n  <td><a href=\"#sustantivo\">Sustantivo<\/a>.<\/td>\n<\/tr>\n<tr>\n  <td><code>orqo / china<\/code><\/td>\n  <td>Distinción de macho y hembra en los ejemplos.<\/td>\n  <td><a href=\"#sustantivo\">Sustantivo<\/a>.<\/td>\n<\/tr>\n<tr>\n  <td><code>-q<\/code> en <code>takiq<\/code><\/td>\n  <td>Nombre de quien realiza una actividad.<\/td>\n  <td><a href=\"#sustantivo\">Sustantivos derivados<\/a>.<\/td>\n<\/tr>\n<tr>\n  <td><code>-kaq<\/code> en <code>yanakaq<\/code><\/td>\n  <td>Forma incluida entre los derivados de adjetivos.<\/td>\n  <td><a href=\"#sustantivo\">Sustantivos derivados<\/a>.<\/td>\n<\/tr>\n<tr>\n  <td><code>-q / -pa<\/code> en el poseedor<\/td>\n  <td>Relación «de», según las formas de la tabla.<\/td>\n  <td><a href=\"#posesion\">Posesión<\/a>.<\/td>\n<\/tr>\n<tr>\n  <td><code>-y, -yki, -n, -nchis, -yku, -ykichis, -nku<\/code><\/td>\n  <td>Persona poseedora con <code>wasi<\/code>.<\/td>\n  <td><a href=\"#posesion\">Posesión<\/a>.<\/td>\n<\/tr>\n<tr>\n  <td><code>-pi<\/code><\/td>\n  <td>Lugar, «en».<\/td>\n  <td><a href=\"#sufijos-caso\">Sufijos de relación<\/a>.<\/td>\n<\/tr>\n<tr>\n  <td><code>-wan<\/code><\/td>\n  <td>Compañía, «con».<\/td>\n  <td><a href=\"#sufijos-caso\">Sufijos de relación<\/a>.<\/td>\n<\/tr>\n<tr>\n  <td><code>-wa-<\/code> en las formas verbales<\/td>\n  <td>Objeto de primera persona; distinto de «con».<\/td>\n  <td><a href=\"#sufijos-caso\">Me y nos<\/a>.<\/td>\n<\/tr>\n<tr>\n  <td><code>-manta<\/code><\/td>\n  <td>Procedencia.<\/td>\n  <td><a href=\"#sufijos-caso\">Sufijos de relación<\/a>.<\/td>\n<\/tr>\n<tr>\n  <td><code>-kama<\/code><\/td>\n  <td>Límite.<\/td>\n  <td><a href=\"#sufijos-caso\">Sufijos de relación<\/a>.<\/td>\n<\/tr>\n<tr>\n  <td><code>-man<\/code><\/td>\n  <td>Dirección.<\/td>\n  <td><a href=\"#sufijos-caso\">Sufijos de relación<\/a>.<\/td>\n<\/tr>\n<tr>\n  <td><code>-ta<\/code><\/td>\n  <td>Objeto; también aparece con destino en la lección.<\/td>\n  <td><a href=\"#sufijos-caso\">Sufijos de relación<\/a>.<\/td>\n<\/tr>\n<tr>\n  <td><code>-rayku<\/code><\/td>\n  <td>Causa o motivo.<\/td>\n  <td><a href=\"#sufijos-caso\">Sufijos de relación<\/a>.<\/td>\n<\/tr>\n<tr>\n  <td><code>-nta / -ninta<\/code><\/td>\n  <td>Trayecto, según el rótulo del curso.<\/td>\n  <td><a href=\"#sufijos-caso\">Sufijos de relación<\/a>.<\/td>\n<\/tr>\n<tr>\n  <td><code>-paq<\/code><\/td>\n  <td>Para un beneficiario.<\/td>\n  <td><a href=\"#sufijos-caso\">Sufijos de relación<\/a>.<\/td>\n<\/tr>\n<tr>\n  <td><code>-n / -mi<\/code><\/td>\n  <td>Afirmación y énfasis; distinguir de persona y posesión.<\/td>\n  <td><a href=\"#matices\">Matices<\/a>.<\/td>\n<\/tr>\n<tr>\n  <td><code>-qa<\/code><\/td>\n  <td>Tema de lo que se dice; énfasis en la explicación del PDF.<\/td>\n  <td><a href=\"#matices\">Matices<\/a>.<\/td>\n<\/tr>\n<tr>\n  <td><code>-puni<\/code><\/td>\n  <td>Insistencia, identificación, certeza según el contexto.<\/td>\n  <td><a href=\"#matices\">Matices<\/a>.<\/td>\n<\/tr>\n<tr>\n  <td><code>-punin / -puniyá<\/code><\/td>\n  <td>Combinaciones enfatizadoras de la lección.<\/td>\n  <td><a href=\"#matices\">Matices<\/a>.<\/td>\n<\/tr>\n<tr>\n  <td><code>-chu<\/code><\/td>\n  <td>Interrogación; negación con <code>mana<\/code> y prohibición con <code>ama<\/code>.<\/td>\n  <td><a href=\"#matices\">Matices<\/a>.<\/td>\n<\/tr>\n<tr>\n  <td><code>-lla<\/code><\/td>\n  <td>Restricción o afecto según la construcción.<\/td>\n  <td><a href=\"#matices\">Matices<\/a>.<\/td>\n<\/tr>\n<tr>\n  <td><code>-ña<\/code><\/td>\n  <td>Ya; ya no con negación.<\/td>\n  <td><a href=\"#matices\">Matices<\/a>.<\/td>\n<\/tr>\n<tr>\n  <td><code>-yá<\/code><\/td>\n  <td>Énfasis emotivo, «pues».<\/td>\n  <td><a href=\"#matices\">Matices<\/a>.<\/td>\n<\/tr>\n<tr>\n  <td><code>-má<\/code><\/td>\n  <td>Sorpresa en la explicación de clase.<\/td>\n  <td><a href=\"#matices\">Matices<\/a>.<\/td>\n<\/tr>\n<tr>\n  <td><code>-pas / -pis<\/code><\/td>\n  <td>También en los ejemplos.<\/td>\n  <td><a href=\"#matices\">Matices<\/a>.<\/td>\n<\/tr>\n<tr>\n  <td><code>-cha<\/code><\/td>\n  <td>Diminutivo o afectivo.<\/td>\n  <td><a href=\"#derivacion\">Derivación<\/a>.<\/td>\n<\/tr>\n<tr>\n  <td><code>-chá<\/code><\/td>\n  <td>Posibilidad o duda.<\/td>\n  <td><a href=\"#matices\">Matices<\/a>.<\/td>\n<\/tr>\n<tr>\n  <td><code>-lla-ña<\/code><\/td>\n  <td>Restricción combinada con el valor de <code>-ña<\/code>.<\/td>\n  <td><a href=\"#matices\">Matices<\/a>.<\/td>\n<\/tr>\n<tr>\n  <td><code>ñeqe<\/code><\/td>\n  <td>Ordinales.<\/td>\n  <td><a href=\"#numerales\">Numerales<\/a>.<\/td>\n<\/tr>\n<tr>\n  <td><code>kuti<\/code><\/td>\n  <td>Veces, frecuencia.<\/td>\n  <td><a href=\"#numerales\">Numerales<\/a>.<\/td>\n<\/tr>\n<tr>\n  <td><code>-ntin / -nintin<\/code><\/td>\n  <td>Integrantes considerados en conjunto.<\/td>\n  <td><a href=\"#numerales\">Numerales<\/a>.<\/td>\n<\/tr>\n<tr>\n  <td><code>-sapa<\/code><\/td>\n  <td>Tamaño destacado o abundancia.<\/td>\n  <td><a href=\"#derivacion\">Derivación<\/a>.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><a id=\"revision\"><\/a><\/p>\n<h2>14. Notas de revisión<\/h2>\n<p>Se separan las grafías que se deben conservar, las simplificaciones que conviene no memorizar literalmente y las dudas léxicas que requieren confirmación. No se ha reescrito el material quechua de forma silenciosa.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Nota<\/th>\n  <th>Tema<\/th>\n  <th>Qué se observa y cómo se trata en esta guía<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><a id=\"revision-r01\"><\/a>R01<\/td>\n  <td><code>-n / -mi<\/code> como «es»<\/td>\n  <td>C05, pp. 6-7 alterna «enfatizador» y «verbo». Se mantiene el uso de clase, explicando que la traducción española con «es» no es una equivalencia universal. Se distinguen los <code>-n<\/code> de afirmación, posesión y conjugación.<\/td>\n<\/tr>\n<tr>\n  <td><a id=\"revision-r02\"><\/a>R02<\/td>\n  <td><code>WAN = con / me<\/code><\/td>\n  <td>C04, p. 5 reúne dos estructuras bajo un rótulo. Se distingue el sufijo nominal <code>-wan<\/code> de la secuencia verbal <code>-wa-n<\/code> en <code>yachachiwan<\/code>.<\/td>\n<\/tr>\n<tr>\n  <td><a id=\"revision-r03\"><\/a>R03<\/td>\n  <td><code>-pas / -pis<\/code><\/td>\n  <td>C05, p. 12 propone una división por categorías que sus ejemplos contradicen. Se registra el valor «también» de ambas formas y se conserva su escritura en cada oración.<\/td>\n<\/tr>\n<tr>\n  <td><a id=\"revision-r04\"><\/a>R04<\/td>\n  <td><code>-ta<\/code> y el artículo<\/td>\n  <td>C04, p. 9 lo vincula a «el/la». Se explica su función de objeto en los ejemplos, sin enseñarlo como artículo. También se conserva el destino de <code>Acosta ch'usan<\/code>.<\/td>\n<\/tr>\n<tr>\n  <td><a id=\"revision-r05\"><\/a>R05<\/td>\n  <td><code>-nta/-ninta<\/code> frente a <code>nta/inta<\/code><\/td>\n  <td>C04, pp. 3 y 11 usa <code>nta/ninta<\/code>; la p. 13 imprime <code>nta/inta<\/code>. Se sigue la forma del encabezado y de los ejemplos, dejando <code>inta<\/code> sin confirmar.<\/td>\n<\/tr>\n<tr>\n  <td><a id=\"revision-r06\"><\/a>R06<\/td>\n  <td><code>kinrayman<\/code><\/td>\n  <td>C04, p. 8 imprime «a la quebraba», ajustado aquí a «a la quebrada». La equivalencia léxica de <code>kinray<\/code> requiere confirmación; no afecta al reconocimiento de <code>-man<\/code>.<\/td>\n<\/tr>\n<tr>\n  <td><a id=\"revision-r07\"><\/a>R07<\/td>\n  <td><code>hamunkichis<\/code>: vienen/vendrán<\/td>\n  <td>C04, p. 11 da futuro y p. 14 presente para la misma oración. El paradigma C02, p. 30 muestra esa coincidencia de segunda persona. Se conservan ambas lecturas contextuales.<\/td>\n<\/tr>\n<tr>\n  <td><a id=\"revision-r08\"><\/a>R08<\/td>\n  <td>Clasificación de los derivados<\/td>\n  <td>C03, p. 12 titula «sustantivo nominal» la serie <code>auqanakuq, takipakuq, atipakuq<\/code> sin explicar sus bases. Se transcribe la agrupación y no se toma su rótulo como una regla de derivación demostrada.<\/td>\n<\/tr>\n<tr>\n  <td><a id=\"revision-r09\"><\/a>R09<\/td>\n  <td>Listas de adjetivos<\/td>\n  <td>C06, pp. 6, 9-10 incluye glosas como «grasa», «pesado», «montón» y «escama» bajo categorías heterogéneas. Se conservan las correspondencias de la tabla y se evita inferir que todas pertenecen a una misma clase gramatical en cualquier uso.<\/td>\n<\/tr>\n<tr>\n  <td><a id=\"revision-r10\"><\/a>R10<\/td>\n  <td><code>p'osqo<\/code><\/td>\n  <td>En C06, p. 7 se glosa «agrio, fermentado». Los PDF de Nivel1 lo glosaban «salado». Esta guía registra la lectura de Nivel2 y deja constancia del conflicto; el diccionario previo no se modifica.<\/td>\n<\/tr>\n<tr>\n  <td><a id=\"revision-r11\"><\/a>R11<\/td>\n  <td>Variantes de escritura<\/td>\n  <td>Se conservan <code>pujllay/pukllay<\/code>, <code>mishk'i/misk'i<\/code>, <code>haja/haya<\/code>, <code>askha/ashkha<\/code>, <code>esqon<\/code>, <code>wishlla<\/code>, <code>p'unchau<\/code>, <code>-yoq<\/code> y <code>p'aqocha<\/code> donde aparecen. No se corrige una consonante, una vocal ni una tilde solo para uniformar.<\/td>\n<\/tr>\n<tr>\n  <td><a id=\"revision-r12\"><\/a>R12<\/td>\n  <td>Formas aisladas o glosas pendientes<\/td>\n  <td><code>urayuy<\/code> «bajar» y <code>qachay<\/code> «secar» (C02, pp. 13, 25), <code>pasaq kuti<\/code> «varias veces» (C06, p. 13), y las grafías <code>Takipayukushan<\/code>, <code>ñausakaq<\/code>, <code>chaupikaq<\/code> (C03, p. 12) se conservan como están. No se construyen reglas nuevas a partir de ellas.<\/td>\n<\/tr>\n<tr>\n  <td><a id=\"revision-r13\"><\/a>R13<\/td>\n  <td>«Números proporcionales» y «gentilicios»<\/td>\n  <td>Se mantienen los rótulos de C06, pp. 13 y 15; se aclara que sus ejemplos tratan de veces/frecuencia y de procedencia, respectivamente.<\/td>\n<\/tr>\n<tr>\n  <td><a id=\"revision-r14\"><\/a>R14<\/td>\n  <td>Sustantivos abstractos<\/td>\n  <td>La lista de C03, p. 10 no aporta traducción ni justificación para cada elemento. Se conserva como lista del curso, sin fabricar nuevas acepciones de <code>apuyaya<\/code>, <code>killki<\/code> u otras formas.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Los ejemplos también contienen formas como <code>-shan<\/code>, <code>-sqa<\/code>, <code>-spa<\/code>, <code>-chun<\/code>, <code>-mu-<\/code> y <code>-yuq/-yoq<\/code>. Aparecen dentro de oraciones, pero estas seis lecciones no desarrollan todos sus paradigmas ni sus usos. Se comentan solo cuando hace falta para leer el ejemplo; su aparición no se presenta como un capítulo completo ya cubierto.<\/p>\n<p><a id=\"fuentes\"><\/a><\/p>\n<h2>15. Fuentes y cobertura de las lecciones<\/h2>\n<h3>15.1. PDF de nivel2<\/h3>\n<p>Las fechas proceden de los nombres de archivo. Las referencias de página cuentan desde la portada como página 1. Se revisaron también las páginas principalmente visuales y las de cierre.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Clase<\/th>\n  <th>Fecha<\/th>\n  <th>Archivo original<\/th>\n  <th style=\"text-align:right\">Páginas<\/th>\n  <th>Contenido y localización<\/th>\n  <th>Secciones de esta guía<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><a id=\"fuente-01\"><\/a><strong>C01<\/strong><\/td>\n  <td>05/10/2026<\/td>\n  <td><span class=\"source-reference\" title=\"Referencia del material de clase; archivo original no publicado\">1_Qheswa simi_Iskay ñeqe_05_10_2026.pdf<\/span><\/td>\n  <td style=\"text-align:right\">7<\/td>\n  <td>Repaso: días de la semana (p. 3), alfabeto y sonidos (pp. 4-5).<\/td>\n  <td>1; los días son repaso léxico.<\/td>\n<\/tr>\n<tr>\n  <td><a id=\"fuente-02\"><\/a><strong>C02<\/strong><\/td>\n  <td>07/10/2026<\/td>\n  <td><span class=\"source-reference\" title=\"Referencia del material de clase; archivo original no publicado\">2_Qheswa simi_Iskay ñeqe_07_10_2026.pdf<\/span><\/td>\n  <td style=\"text-align:right\">31<\/td>\n  <td>Diálogo (p. 3); diagrama numérico (p. 4); verbos (pp. 5-27); oración SOV (p. 28); conjugación (pp. 29-30).<\/td>\n  <td>2, 3, 9 y 12.<\/td>\n<\/tr>\n<tr>\n  <td><a id=\"fuente-03\"><\/a><strong>C03<\/strong><\/td>\n  <td>09/10/2026<\/td>\n  <td><span class=\"source-reference\" title=\"Referencia del material de clase; archivo original no publicado\">3_Qheswa simi_Iskay ñeqe_09_10_2026.pdf<\/span><\/td>\n  <td style=\"text-align:right\">14<\/td>\n  <td>Sustantivo, plural, género y clasificaciones (pp. 3-13); repaso SOV (p. 5).<\/td>\n  <td>2 y 4.<\/td>\n<\/tr>\n<tr>\n  <td><a id=\"fuente-04\"><\/a><strong>C04<\/strong><\/td>\n  <td>12/10/2026<\/td>\n  <td><span class=\"source-reference\" title=\"Referencia del material de clase; archivo original no publicado\">4_Qheswa simi_Iskay ñeqe_12_10_2026.pdf<\/span><\/td>\n  <td style=\"text-align:right\">15<\/td>\n  <td>Sufijos de relación y ejemplos de repaso (pp. 3-14).<\/td>\n  <td>5, 6 y 11.<\/td>\n<\/tr>\n<tr>\n  <td><a id=\"fuente-05\"><\/a><strong>C05<\/strong><\/td>\n  <td>14/10/2026<\/td>\n  <td><span class=\"source-reference\" title=\"Referencia del material de clase; archivo original no publicado\">5_Qheswa simi_Iskay ñeqe_14_10_2026.pdf<\/span><\/td>\n  <td style=\"text-align:right\">14<\/td>\n  <td>Énfasis, interrogación, negación, restricción y otros matices (pp. 3-13).<\/td>\n  <td>7, 10 y 11.<\/td>\n<\/tr>\n<tr>\n  <td><a id=\"fuente-06\"><\/a><strong>C06<\/strong><\/td>\n  <td>16/10/2026<\/td>\n  <td><span class=\"source-reference\" title=\"Referencia del material de clase; archivo original no publicado\">6_Qheswa simi_Iskay ñeqe_16_10_2026.pdf<\/span><\/td>\n  <td style=\"text-align:right\">17<\/td>\n  <td>Adjetivos, numerales, posesivos, colectivos, procedencia, aumentativos y diminutivos (pp. 3-16).<\/td>\n  <td>5, 8, 9 y 10.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>15.2. Aclaraciones externas puntuales<\/h3>\n<p>Se consultaron estas fuentes para distinguir <code>-wan<\/code> de <code>-wa-n<\/code>, precisar la función de <code>-ta<\/code> y contextualizar <code>-n/-mi<\/code>, <code>-qa<\/code> y <code>-pas/-pis<\/code>. No se trasladan a los ejemplos la ortografía ni los paradigmas de otros manuales.<\/p>\n<ul>\n<li>Ministerio de Educación del Perú, <a href=\"https://formacionenservicio.minedu.gob.pe/sifods/centro-recurso/2022/Material-educativo/Libro/manual-escritura-quechua-sureno.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Manual de escritura quechua sureño<\/a>: secciones de morfología nominal, sufijos independientes y sufijos normalizados. <a href=\"https://formacionenservicio.minedu.gob.pe/sifods/centro-recurso/2022/Material-educativo/750.018452-Item-9-manual-de-escritura-en-lengua-quechua-sureno-Baja.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Versión alternativa del mismo manual<\/a>.<\/li>\n<li>Curso de quechua alojado en Ohio State University, <a href=\"https://ohiostate.pressbooks.pub/quechua/chapter/chapter-9/\" target=\"_blank\" rel=\"noopener noreferrer\">capítulo 9: pronombres de objeto y formas verbales<\/a>: contraste de objeto de primera persona y terminación verbal.<\/li>\n<\/ul>\n<h3>15.3. Material complementario del proyecto<\/h3>\n<p>Para consultar el vocabulario del primer nivel, véase el <span class=\"source-reference\" title=\"Referencia del material de clase; archivo original no publicado\">Diccionario maestro quechua-español de Nivel1<\/span>. Este archivo de gramática se concentra en lo trabajado en nivel2 y conserva sus referencias propias.<\/p>\n"};</script>
<script>// Ejemplos seleccionados de los documentos maestros. Los guiones son de estudio.
const choice=(prompt,options,answer,explain,hint)=>({type:'choice',prompt,options,answer,explain,hint});
const typing=(prompt,answer,explain,hint)=>({type:'type',prompt,answer,explain,hint});
const order=(prompt,answer,explain,hint)=>({type:'order',prompt,answer,explain,hint});
const UNITS=[
 {title:'Las primeras piezas',tag:'LECTURA Y ORACIÓN',color:'green',icon:'sprout',desc:'Lee con cuidado y construye tus primeras oraciones.',source:'C01 · C02',lessons:[
  {title:'Cada letra cuenta',source:'C01:5',vocab:["p'acha","pitita","p'itita"],guide:`<p>El curso conserva cinco vocales: <b>a, e, i, o, u</b>. Las consonantes simples, aspiradas y glotalizadas se distinguen al escribir.</p><div class="formula">k <span>≠</span> kh <span>≠</span> k'</div><p>El apóstrofo forma parte de la palabra. <b>pitita</b> es «tabique» y <b>p'itita</b> es «habitación» en Nivel 1. No los confundas. En las respuestas se aceptan apóstrofos rectos o curvos; se conservan tildes y <b>ñ</b>.</p>`,exercises:[
   choice('¿Cuál es la serie glotalizada?', ['k, p, t', 'kh, ph, th', "k', p', t'"], "k', p', t'", 'El apóstrofo distingue las consonantes glotalizadas. La h distingue las aspiradas.', 'Busca el apóstrofo.'),
   choice('¿Qué debes conservar al escribir p’acha?', ['El apóstrofo', 'Una tilde en la a', 'Un espacio después de p'], 'El apóstrofo', "p'acha conserva su apóstrofo. No se escribe pacha: es otra forma en el diccionario.", 'La escritura conserva consonantes glotalizadas.'),
   typing('Escribe con apóstrofo recto o curvo: p’acha', "p'acha", 'Las dos formas de apóstrofo representan aquí la misma grafía del curso.', 'Puedes usar la tecla de apóstrofo del teclado.'),
   choice('¿Qué vocales usa este curso?', ['a, i, u', 'a, e, i, o, u', 'Solo a, e, o'], 'a, e, i, o, u', 'La aplicación sigue las cinco vocales de las diapositivas, sin convertirlas a otra norma.', 'Son cinco vocales.'),
   choice('En Nivel 1, pitita y p’itita…', ['Se pueden intercambiar', 'Deben conservarse como entradas diferentes', 'Siempre significan casa'], 'Deben conservarse como entradas diferentes', 'Nivel 1, R6: pitita «tabique» y p’itita «habitación». La semejanza no prueba equivalencia.', 'El apóstrofo cambia la forma.')
  ]},
  {title:'El verbo va al final',source:'C02:28',vocab:['waka','noqa',"llank'ay"],guide:`<p>El orden de referencia de la clase es <b>sujeto + objeto o complemento + verbo</b> (SOV).</p><div class="formula">Ronald <span>+</span> wakanta <span>+</span> michin</div><p><b>Ronald pastea su vaca.</b> Ronald realiza la acción; <b>waka-n-ta</b> reúne vaca + su + objeto; <b>michi-n</b> es «pastea».</p><p>Es el esquema de estudio del curso. No exige que toda oración tenga tres elementos expresos.</p>`,exercises:[
   order('Ordena el ejemplo: Ronald pastea su vaca.', ['Ronald','wakanta','michin'], 'Sujeto Ronald, objeto wakanta y verbo michin al final.', '¿Quién? → ¿qué? → acción.'),
   choice('¿Cuál es el verbo en Ronald wakanta michin?', ['Ronald','wakanta','michin'], 'michin','Michi-n expresa la acción de pastear; waka-n-ta es el objeto.', 'Es la última palabra.'),
   choice('En waka-n-ta, ¿qué señala -ta?', ['El objeto de la acción','La primera persona','La duda'], 'El objeto de la acción', '-ta permite reconocer el objeto en este ejemplo; no es un artículo como «la».', '¿Qué pastea Ronald?'),
   order('Ordena: Yo trabajo con mi hermano.', ['Noqa','wayqeywan',"llank'ani"], 'C04, p. 14: Noqa + wayqeywan + llank’ani. El complemento precede al verbo.', 'Comienza por Noqa y termina con la acción.'),
   choice('¿Qué expresa el esquema SOV del curso?', ['Sujeto + verbo + objeto','Sujeto + objeto/complemento + verbo','Solo palabras con tres sílabas'], 'Sujeto + objeto/complemento + verbo','La acción ocupa la posición final en estos ejemplos. Se estudia una estructura de referencia.', 'El verbo es la V final.')
  ]},
  {title:'Una palabra, varias piezas',source:'C06:14',vocab:['wasi','mama','michi'],guide:`<p>Una base puede recibir varias terminaciones. Los guiones te ayudan a verlas, pero la palabra se escribe junta.</p><div class="formula">wasi <span>+</span> y <span>+</span> kuna <span>=</span> wasiykuna</div><p><b>Wasi</b>: casa. <b>-y</b>: mi. <b>-kuna</b>: plural. Resultado: «mis casas».</p><p>En <b>mama-y-wan</b>, la misma marca posesiva precede a la relación «con»: «con mi mamá» (C04, p. 4).</p>`,exercises:[
   choice('¿Cuál es la base de wasi-y-kuna?', ['wasi','-y','-kuna'], 'wasi','La base wasi aporta «casa»; las terminaciones aportan posesión y plural.', 'Busca la parte con significado «casa».'),
   order('Construye la segmentación de «mis casas».', ['wasi','-y','-kuna'], 'Base + posesión + plural. Los guiones solo muestran el análisis.', 'Primero casa, después mi, después plural.'),
   typing('Escribe junta la forma wasi-y-kuna.', 'wasiykuna','En la escritura corriente del ejemplo no se insertan guiones ni espacios.', 'Une las tres piezas.'),
   choice('¿Qué parte de mama-y-wan expresa «con»?', ['mama','-y','-wan'], '-wan','-wan indica compañía; -y indica que se trata de mi mamá.', 'La relación se añade al final.'),
   choice('Los guiones en wasi-y-kuna sirven para…', ['Separar palabras al escribir','Mostrar las partes para estudiarlas','Marcar una pregunta'], 'Mostrar las partes para estudiarlas','El ejemplo original se escribe wasiykuna. La segmentación es una ayuda de la guía.', 'Son una herramienta de análisis.')
  ]}
 ]},
 {title:'Pon las acciones en marcha',tag:'PRONOMBRES Y CONJUGACIÓN',color:'blue',icon:'bolt',desc:'Del presente al futuro, con el modelo llank’ay.',source:'C02',lessons:[
  {title:'Yo, tú y nosotros',source:'C02:30',vocab:['noqa','noqanchis','noqayku',"llank'ay"],guide:`<p>El modelo <b>llank'ay</b> significa «trabajar». Su raíz es <b>llank'a-</b>; el presente tiene marcas personales.</p><div class="formula">noqa llank'a-ni <span>·</span> qan llank'a-nki</div><p><b>Noqanchis</b> incluye a quien escucha; <b>noqayku</b> no lo incluye. Sus terminaciones son <b>-nchis</b> y <b>-yku</b>. Las traducciones españolas son glosas de la guía.</p>`,exercises:[
   choice('«Nosotros, incluyéndote a ti» corresponde a…',['noqanchis','noqayku','paykuna'],'noqanchis','Noqanchis incluye al interlocutor. Noqayku lo excluye.', 'La forma incluyente termina en -nchis.'),
   typing('Completa: noqa ___ («yo trabajo»).', "llank'ani", 'Llank’a-ni: raíz + primera persona singular del presente.', 'Raíz llank’a- más -ni.'),
   choice('Qan, en presente: ¿qué forma corresponde?', ["llank'ani","llank'anki","llank'an"],"llank'anki",'Qan utiliza -nki en el presente del paradigma.', 'Tú → -nki.'),
   choice('Noqayku llank’ayku significa…',['Trabajamos, sin incluir a quien escucha','Trabajan ellos','Trabajas tú'],'Trabajamos, sin incluir a quien escucha','Noqayku es la primera persona plural excluyente. No es intercambiable con noqanchis.', 'Fíjate en el pronombre.'),
   typing('Completa: paykuna ___ («ellos trabajan»).',"llank'anku",'La tercera persona plural del presente termina en -nku.', 'Llank’a- + -nku.')
  ]},
  {title:'Ayer y mañana',source:'C02:30',vocab:["llank'ay",'qan','qankuna'],guide:`<p>El pasado del modelo inserta <b>-ra-</b> antes de la marca personal: <b>llank'a-ra-ni</b>, «trabajé».</p><div class="formula">llank'arani <span>→ pasado</span><br>llank'asaq <span>→ futuro</span></div><p>El futuro se estudia por persona: <b>noqa llank'asaq</b>, <b>pay llank'anqa</b>. Para noqanchis, la tabla admite <b>llank'asunchis</b> y <b>llank'asun</b>.</p><p><b>Qan llank'anki</b> y <b>qankuna llank'ankichis</b> coinciden en presente y futuro. El contexto temporal aclara la lectura.</p>`,exercises:[
   typing('Noqa, pasado: «trabajé».',"llank'arani",'El curso usa llank’a-ra-ni: raíz + pasado -ra- + persona -ni.', 'Inserta -ra- antes de -ni.'),
   typing('Noqa, futuro: «trabajaré».',"llank'asaq",'La primera persona singular futura del modelo es llank’asaq.', 'Llank’a- + -saq.'),
   choice('Pay, futuro: «trabajará».',["llank'anqa","llank'aran","llank'an"],"llank'anqa",'-nqa es la terminación del futuro de tercera persona singular en esta tabla.', 'No es pasado ni presente.'),
   typing('Noqanchis, futuro: escribe una de las dos variantes.',["llank'asunchis","llank'asun"],'La tabla admite ambas formas del futuro incluyente; las dos se aceptan.', 'Llank’a- + -sunchis o -sun.'),
   choice('Sin contexto, qan llank’anki puede ser…',['Solo pasado','Presente o futuro','Solo futuro'],'Presente o futuro','La tabla escribe la misma forma para ambos tiempos. No se inventa una diferencia gráfica.', 'Consulta las dos columnas del modelo.')
  ]},
  {title:'Del vocabulario a la regla',source:'C02:30',vocab:['taki','takiq','tusuy','puriy'],guide:`<p>Nivel 1 aporta <b>tusuy</b> (bailar) y <b>puriy</b> (caminar). C02 añade <b>takiy</b> (cantar); Nivel 1 registra las formas relacionadas <b>taki</b> (canto) y <b>takiq</b> (cantante).</p><div class="formula">taki-y <span>→</span> taki-ni</div><p>Esta práctica <b>aplica el modelo de presente</b> a tres verbos seleccionados. Las formas practicadas son construcciones didácticas, no una tabla transcrita de los PDF. El taller conserva esta etiqueta.</p><p>Para reconocer a quien hace una actividad, sí hay ejemplos de clase: <b>taki-q</b>, cantante; <b>puri-q</b>, caminante (C03, p. 12).</p>`,exercises:[
   choice('Consulta C02, p. 8: takiy es…',['Cantar','Bailar','Caminar'],'Cantar','Takiy aparece como «cantar». Esta base alimenta la práctica guiada de presente.', 'Piensa en la actividad de un cantante.'),
   typing('Aplicación del modelo: taki- + -ni. Escribe la forma junta.', 'takini','Práctica construida: se aplica -ni, primera persona, a la base taki-. No es una transcripción del paradigma de clase.', 'Sustituye la -y del infinitivo por -ni.'),
   typing('Aplicación del modelo: tusu- + -nki. Escribe la forma junta.', 'tusunki','Práctica construida: tusuy «bailar» más la marca de segunda persona del presente.', 'Une tusu y nki.'),
   typing('Aplicación del modelo: puri- + -n. Escribe la forma junta.', 'purin','Práctica construida de presente: puriy «caminar», raíz puri-, tercera persona -n.', 'Une puri y n.'),
   choice('¿Cuál es el «caminante» documentado en C03?', ['puriq','puriy','purin'],'puriq','C03, p. 12 da puri-q, «caminante». -q y -n cumplen funciones diferentes.', 'Base verbal + -q nombra a quien realiza la acción.')
  ]}
 ]},
 {title:'Lo que es tuyo y mío',tag:'SUSTANTIVOS Y POSESIÓN',color:'orange',icon:'home',desc:'Nombra, cuenta y expresa a quién pertenece algo.',source:'C03 · C06',lessons:[
  {title:'Uno y varios',source:'C03:6',vocab:['michi','rumi','ayllu','runtu'],guide:`<p><b>Suti</b> es el sustantivo. En la tabla, el plural se forma con <b>-kuna</b>: <b>michi → michikuna</b>, «gato → gatos».</p><p>Las clasificaciones responden a preguntas distintas. <b>Ayllu</b> es colectivo por su significado; <b>yachay wasi</b> es compuesto por su formación.</p><p>Con un numeral, observa el ejemplo: <b>iskay runtuta</b>, «dos huevos», aparece sin -kuna (C03, p. 13). No añadas plural automáticamente.</p>`,exercises:[
   typing('Escribe el plural de michi de la tabla.', 'michikuna','Michi + -kuna: gatos.', 'Añade -kuna.'),
   typing('Escribe el plural de rumi de la tabla.', 'rumikuna','Rumi + -kuna: piedras.', 'Conserva la base completa.'),
   choice('Ayllu, «familia», se presenta como sustantivo…',['Colectivo','Propio','Adjetivo'],'Colectivo','Nombra un conjunto. Esta clasificación trata del significado, no de la formación.', 'Una familia es un conjunto.'),
   choice('¿Qué forma aparece en el ejemplo «dos huevos»?',['iskay runtuta','iskay runtukunata','iskaykunata'],'iskay runtuta','El ejemplo de C03, p. 13 conserva iskay runtu-ta sin -kuna. Aquí se reconoce lo que está escrito.', 'No añadas una terminación que el ejemplo no tiene.'),
   choice('En china michi, china permite expresar…',['Gata, hembra','Plural','Posesión'],'Gata, hembra','C03, p. 7 usa china antes del animal. No es un cambio español de -o por -a.', 'Es la palabra que especifica hembra.')
  ]},
  {title:'Mi casa, nuestra casa',source:'C06:14',vocab:['wasi','noqanchis','noqayku'],guide:`<p>La persona poseedora se marca en el nombre: <b>wasi-y</b>, mi casa; <b>wasi-yki</b>, tu casa; <b>wasi-n</b>, su casa (de él o ella).</p><div class="formula">wasinchis <span>incluyéndote</span><br>wasiyku <span>sin incluirte</span></div><p><b>Wasiykichis</b> es la casa de ustedes; <b>wasinku</b>, la casa de ellos. Un poseedor plural no obliga a que haya varias casas.</p>`,exercises:[
   typing('Escribe «tu casa», según la tabla.', 'wasiyki','Wasi-yki: casa + tu. Es posesión, no una forma verbal.', 'La marca es -yki.'),
   choice('Nuestra casa, incluyéndote:',['wasiyku','wasinchis','wasinku'],'wasinchis','-nchis marca al poseedor incluyente; -yku al excluyente.', 'Noqanchis → -nchis.'),
   typing('Escribe «nuestra casa», sin incluir a quien escucha.', 'wasiyku','Wasi-yku corresponde a noqayku, el poseedor excluyente.', 'La terminación es -yku.'),
   choice('Wasinku indica…',['Varias casas obligatoriamente','La casa de ellos o ellas','Tu casa'],'La casa de ellos o ellas','El poseedor es plural. La tabla no añade -kuna al nombre poseído.', 'No confundas quién posee con cuántas casas hay.'),
   typing('Escribe «la casa de ustedes», según la tabla.', 'wasiykichis','Wasi-ykichis: la terminación posesiva de ustedes es -ykichis.', 'Tiene y: -ykichis.')
  ]},
  {title:'Encadena las piezas',source:'C04:4',vocab:['wasi','mama','churi'],guide:`<p>El orden observado es <b>nombre + posesión + relación</b>.</p><div class="formula">mama <span>+</span> y <span>+</span> wan <span>=</span> mamaywan</div><p><b>Wasi-y-pi</b>: en mi casa. <b>Churi-y-paq</b>: para mi hijo. Son formas de los ejemplos de C04. Para pluralizar lo poseído, C06 muestra <b>wasi-y-kuna</b>, mis casas.</p><p>En <b>wasi-n</b>, -n es posesión; en <b>michi-n</b>, es persona verbal. La misma secuencia escrita puede cumplir funciones diferentes.</p>`,exercises:[
   order('Segmenta «con mi mamá».', ['mama','-y','-wan'],'Nombre + mi + con. La forma escrita es mamaywan.', 'Primero el nombre; luego la posesión; al final compañía.'),
   typing('Escribe junta la forma «en mi casa»: wasi-y-pi.', 'wasiypi','-y expresa posesión y -pi lugar, en ese orden.', 'Une wasi, y y pi.'),
   typing('Escribe junta la forma «para mi hijo»: churi-y-paq.', 'churiypaq','El beneficiario se expresa con -paq después de la marca posesiva.', 'Une las tres piezas.'),
   choice('¿Qué marca la -n de wasin?',['Su casa, posesión','Un verbo en tercera persona','Una pregunta'],'Su casa, posesión','En wasin, la base es un sustantivo y -n señala al poseedor. En michin, -n pertenece al verbo.', 'Wasi es casa, un nombre.'),
   typing('Escribe «mis casas», según C06.', 'wasiykuna','Wasi-y-kuna: primero el poseedor, luego el plural de las casas.', 'No intercambies -y y -kuna.')
  ]}
 ]},
 {title:'Conecta tu mundo',tag:'LUGAR, COMPAÑÍA Y DESTINO',color:'teal',icon:'compass',desc:'En casa, con alguien, desde un lugar o hacia él.',source:'C04',lessons:[
  {title:'Dónde y con quién',source:'C04:4',vocab:['llaqta','mama','tayta','wasi'],guide:`<p><b>-pi</b> indica lugar: <b>llaqta-pi</b>, en el pueblo. <b>Kaypi</b> es «aquí» y <b>chaypi</b>, «ahí».</p><p><b>-wan</b> indica compañía: <b>mama-y-wan</b>, con mi mamá; <b>pay-wan</b>, con él o ella.</p><div class="formula">Kaypi taytaywan tiyani.</div><p>«Aquí vivo con mi padre.» En <b>yachachi-wa-n</b>, «me enseña», <b>-wa-</b> está dentro del verbo: es una estructura distinta (R02).</p>`,exercises:[
   choice('Llaqtapi expresa…',['En el pueblo','Desde el pueblo','Para el pueblo'],'En el pueblo','-pi localiza. No expresa procedencia ni beneficiario.', 'Pregunta: ¿dónde?'),
   order('Ordena: Aquí vivo con mi padre.', ['Kaypi','taytaywan','tiyani'],'El ejemplo conserva el lugar al inicio y el verbo al final.', 'Lugar → compañía → verbo.'),
   typing('Completa pay-___ («con él o ella»).', 'wan','Pay-wan expresa compañía. Escribe solo el sufijo sin guion.', 'El sufijo de compañía.'),
   choice('En yachachi-wa-n, el segmento -wa- indica…',['Con alguien','Objeto de primera persona: me','Un lugar'],'Objeto de primera persona: me','El análisis verbal yachachi-wa-n distingue el objeto -wa- de la persona -n. No es el -wan nominal «con».', 'La traducción del ejemplo es «me enseña».'),
   typing('Escribe «con mi mamá»: mama-y-wan.', 'mamaywan','La posesión -y precede a la compañía -wan.', 'Es una sola palabra.')
  ]},
  {title:'De dónde y hacia dónde',source:'C04:6',vocab:['wasi','orqo','chakra','wata'],guide:`<p><b>-manta</b>: procedencia. <b>Qosqomanta</b>, de Cusco.<br><b>-man</b>: dirección. <b>Wasiman</b>, a la casa.<br><b>-kama</b>: límite. <b>Hoq watakama</b>, hasta el próximo año.</p><div class="formula">Qosqo-manta <span>origen</span><br>chakra-man <span>destino</span></div><p>En <b>Chaparro k'ijllunta hamunki</b> se destaca el trayecto: por la calle Chaparro. La clase muestra <b>-nta/-ninta</b> (p. 11); la variante impresa -inta queda sin confirmar.</p>`,exercises:[
   order('Ordena: Yo vengo del Cusco.', ['Noqa','Qosqomanta','hamuni'],'-manta señala el origen. El verbo hamuni cierra el ejemplo.', 'Yo → del Cusco → vengo.'),
   typing('Escribe «a la casa»: wasi + -man.', 'wasiman','-man expresa dirección hacia el destino.', 'Conserva la n final.'),
   choice('Chakraman indica…',['En la chacra','A la chacra','Desde la chacra'],'A la chacra','Chakra-man: nombre + dirección. -pi sería lugar; -manta, origen.', 'La terminación es -man.'),
   order('Ordena la despedida «hasta el próximo año».', ['Hoq','watakama'],'La expresión de C04, p. 7 usa -kama como límite temporal.', 'Hoq va antes de la palabra que termina en -kama.'),
   choice('En «por la calle Chaparro», la relación es…',['Causa','Trayecto','Posesión'],'Trayecto','C04, p. 11: Chaparro k’ijllunta hamunki destaca por dónde se transita, no por qué.', 'Es un recorrido.')
  ]},
  {title:'Para quién y por qué',source:'C04:12',vocab:['warmi','churi','qolqe','ñan'],guide:`<p><b>-paq</b> expresa finalidad o beneficiario: <b>churi-y-paq</b>, para mi hijo.<br><b>-rayku</b> señala motivo: <b>qolqe-rayku</b>, por dinero.</p><p><b>-ta</b> marca el objeto en <b>Taytay payta maskhan</b>: «mi padre lo busca a él». La clase también muestra un uso de destino en <b>Acosta ch'usan</b>. No se enseña -ta como artículo.</p><div class="formula">Noqa warmiypaq munay wasita rantisaq.</div><p>«Yo voy a comprar una hermosa casa para mi mujer.» <b>Warmi-y-paq</b> es la beneficiaria; <b>munay wasi-ta</b>, el objeto (C04, p. 14).</p>`,exercises:[
   choice('¿Qué sufijo indica beneficiario en warmiypaq?',['-paq','-rayku','-ta'],'-paq','-paq expresa «para». -y señala «mi», no la finalidad.', 'Pregunta: ¿para quién?'),
   typing('Escribe «por dinero»: qolqe + -rayku.', 'qolqerayku','-rayku expresa la causa o motivo. No es el «por» de un trayecto.', 'Une la base con rayku.'),
   choice('Ima-rayku pregunta…',['¿Dónde?','¿Por qué?','¿Con quién?'],'¿Por qué?','La pregunta busca el motivo, de acuerdo con C04, p. 10.', 'Reconoce el sufijo causal.'),
   order('Ordena: Mi padre lo busca a él.', ['Taytay','payta','maskhan'],'Taytay es sujeto; pay-ta es objeto; maskhan es el verbo final.', 'Sujeto → objeto → verbo.'),
   choice('En munay wasita, ¿qué forma lleva la marca de objeto?', ['munay','wasita','Noqa'],'wasita','Wasi-ta es la casa como objeto de comprar. Munay expresa la cualidad antes del sustantivo.', 'Busca la terminación -ta.')
  ]}
 ]},
 {title:'Dale intención a lo que dices',tag:'PREGUNTAS, NEGACIÓN Y MATICES',color:'purple',icon:'chat',desc:'Pregunta, destaca y distingue certeza de posibilidad.',source:'C05',lessons:[
  {title:'Preguntar y negar',source:'C05:6',vocab:['alqo','ama','noqa'],guide:`<p><b>-chu</b> aparece en preguntas, negaciones y prohibiciones. La construcción completa determina el sentido.</p><div class="example-grid"><div><b>Alqochu?</b><span>¿Es el perro?</span></div><div><b>Mana mihusaqchu.</b><span>No comeré.</span></div><div><b>Ama pukllaychu.</b><span>No juegues.</span></div></div><p>Con <b>mana</b> se niega; con <b>ama</b> se prohíbe. El ejemplo conserva <b>mihusaq</b> y <b>pukllay</b> como en esta página, sin uniformarlos con otras grafías.</p>`,exercises:[
   choice('Alqochu? es…',['Una pregunta','Una prohibición','Un plural'],'Una pregunta','-chu interroga aquí. Por sí solo no hace negativa la pregunta.', 'No aparece mana ni ama.'),
   order('Ordena: No comeré.', ['Mana','mihusaqchu'],'La negación del ejemplo reúne mana y -chu.', 'La palabra negativa va al principio.'),
   order('Ordena: No juegues.', ['Ama','pukllaychu'],'Ama + forma con -chu expresa la prohibición del ejemplo.', 'Una prohibición empieza con Ama.'),
   choice('Para reconocer la negación, debes leer…',['Solo la última sílaba','La construcción completa, incluida mana o ama','Solo la mayúscula'],'La construcción completa, incluida mana o ama','La misma terminación -chu aparece en funciones distintas según las demás palabras.', 'El contexto de la terminación importa.'),
   order('Ordena el ejemplo «Yo no vendré».', ['Noqaqa','manan','hamusaqchu'],'Noqa-qa presenta el tema; mana-n y -chu construyen la negación. La traducción es de la guía.', 'Tema → negación → verbo.')
  ]},
  {title:'El tema y la afirmación',source:'C05:4',vocab:['yachachiq','noqa','michi'],guide:`<p><b>-qa</b> presenta el tema. No necesita una traducción española independiente.<br><b>-n/-mi</b> afirman o destacan información. El curso usa -n después de vocal y -mi después de consonante.</p><div class="formula">Juan-qa <span>+</span> yachachiq-mi</div><p>«Juan es profesor.» La traducción necesita «es», pero <b>-mi</b> no equivale universalmente a ese verbo.</p><p><b>Noqapuni</b>: yo mismo. <b>Noqallan hamuni</b>: solo yo vengo. <b>Amaña tapuwaychu</b>: ya no me preguntes. Son valores de <b>-puni</b>, <b>-lla</b> y <b>-ña</b> en sus contextos.</p>`,exercises:[
   order('Ordena: Juan es profesor.', ['Juanqa','yachachiqmi'],'Juan-qa es el tema; yachachiq-mi afirma la información.', 'Empieza por la persona de quien se habla.'),
   choice('¿Qué aporta -qa en Juanqa?',['Presenta el tema','Pluraliza Juan','Significa siempre «es»'],'Presenta el tema','La guía lo explica como topicalizador. No se traduce mecánicamente palabra por palabra.', 'Es de quien se va a hablar.'),
   choice('En yachachiqmi, -mi…',['Afirma o destaca la información','Es siempre una conjugación de «ser»','Marca posesión'],'Afirma o destaca la información','La traducción «es profesor» no convierte -mi en un verbo universal. R01 distingue esta simplificación.', 'Piensa en afirmación y énfasis.'),
   choice('Noqallan hamuni se lee en la guía como…',['Solo yo vengo','Tal vez yo venga','Yo también vengo'],'Solo yo vengo','-lla restringe aquí a «solo yo». En saludos puede tener otro matiz.', 'El foco está en la restricción.'),
   choice('En Amaña tapuwaychu, -ña contribuye al sentido…',['Ya no','También','Hacia'],'Ya no','-ña marca cambio. Con ama, el ejemplo se interpreta «ya no me preguntes».', 'La situación cambia respecto de antes.')
  ]},
  {title:'La tilde cambia el sentido',source:'C05:13',vocab:['michi','wallpa','noqa','qan'],guide:`<p><b>-cha</b> sin tilde es diminutivo o afectivo: <b>michicha</b>, gatito.<br><b>-chá</b> con tilde expresa posibilidad o duda: <b>Noqachá paqarin llank'amusaq</b>, quizá yo trabaje mañana.</p><div class="formula">-cha <span>afecto</span><span>≠</span> -chá <span>duda</span></div><p><b>-pas/-pis</b> aportan «también» en los ejemplos. No memorices la división «-pas solo con verbos»: contradice <b>qanpas</b> y <b>mamaypas</b> (R03).</p><p><b>-yá</b> expresa énfasis emotivo («pues»); <b>-má</b> se presenta como sorpresa en esta lección.</p>`,exercises:[
   typing('Escribe el sufijo de posibilidad o duda, con tilde y guion.', '-chá','La tilde es significativa. -cha sin tilde es diminutivo; -chá indica duda.', 'Usa el botón á si lo necesitas.'),
   choice('Michicha significa, en el ejemplo…',['Gatito','Tal vez el gato','Gatos'],'Gatito','Michi-cha usa el diminutivo sin tilde. C06, p. 16.', 'Lee la terminación sin tilde.'),
   choice('Noqachá expresa aquí…',['Yo, quizá','Yo mismo, con certeza','Solo nosotros'],'Yo, quizá','-chá marca posibilidad. Se conserva la tilde del ejemplo.', 'La tilde distingue duda de diminutivo.'),
   choice('¿Qué afirmación sobre -pas/-pis respeta la revisión de la guía?',['-pas aparece solo con verbos','Ambas formas tienen valor «también» en los ejemplos','-pis nunca acompaña a un pronombre'],'Ambas formas tienen valor «también» en los ejemplos','La división por categoría contradice qanpas y mamaypas. Se conserva cada grafía en su ejemplo.', 'La nota R03 advierte contra una regla rígida.'),
   choice('La clase presenta -má como un matiz de…',['Sorpresa','Plural','Dirección'],'Sorpresa','C05, p. 11 lo llama «impresivo». Se explica en los ejemplos, sin inventar un paradigma.', 'Es la reacción del hablante.')
  ]}
 ]},
 {title:'Describe y reúne las piezas',tag:'ADJETIVOS Y REPASO FINAL',color:'rose',icon:'flag',desc:'Cualidades, números y una última vuelta por lo aprendido.',source:'C06 · REPASO',lessons:[
  {title:'Cómo es y cuántas veces',source:'C06:5',vocab:['yana','alqo','rumi','aycha','kinsa'],guide:`<p>La cualidad precede al sustantivo: <b>yana alqo</b>, perro negro; <b>llasa rumi</b>, piedra pesada; <b>sumaq aycha</b>, rica carne.</p><p><b>Kinsa ñeqe</b> es «tercero»; <b>kinsa kuti</b>, «tres veces». Son construcciones distintas.</p><p>El vocabulario se conserva por contexto. <b>Yana</b> tiene más de una acepción en Nivel 1. <b>P'osqo</b> aparece como «salado» en Nivel 1 y «agrio, fermentado» en Nivel 2: queda señalado para revisar, sin convertirlo en pregunta de equivalencia segura.</p>`,exercises:[
   order('Ordena: perro negro.', ['yana','alqo'],'La cualidad yana precede al sustantivo alqo en C06, p. 5.', 'Primero adjetivo; después nombre.'),
   order('Ordena: piedra pesada.', ['llasa','rumi'],'Llasa es la cualidad; rumi es el sustantivo.', 'El nombre va después de la cualidad.'),
   order('Ordena: rica carne.', ['sumaq','aycha'],'Sumaq aycha es el grupo nominal de C06, p. 5.', 'El orden no sigue al español «carne rica».'),
   choice('Kinsa kuti expresa…',['Tercero','Tres veces','Los tres juntos'],'Tres veces','Kuti cuenta veces o frecuencia. Ñeqe se usa para el ordinal.', 'Kuti se relaciona con frecuencia.'),
   choice('Kinsa ñeqe expresa…',['Tres veces','Tercero','Treinta'],'Tercero','Número + ñeqe es el patrón ordinal de la tabla de C06, p. 12.', 'Es una posición en un orden.')
  ]},
  {title:'Juntos, grandes y pequeños',source:'C06:15',vocab:['iskay','tawa','simi','qolqe','michi'],guide:`<p>Los colectivos numéricos reúnen integrantes: <b>tawa-ntin</b>, los cuatro; <b>iskay-nintin</b>, los dos.</p><p><b>-sapa</b> destaca tamaño o abundancia en los ejemplos: <b>simisapa</b>, de boca grande; <b>qolqesapa</b>, que posee mucho dinero. No siempre significa «grande» literalmente.</p><p><b>Alqocha</b>, perrito, muestra el diminutivo -cha. <b>Sapa kuti</b>, cada vez, tiene <b>sapa</b> como palabra separada: es otra construcción.</p>`,exercises:[
   typing('Los cuatro: escribe tawa-ntin junto.', 'tawantin','El ejemplo vocálico de C06 añade -ntin a tawa.', 'No añadas ni entre las partes.'),
   typing('Los dos: escribe iskay-nintin junto.', 'iskaynintin','Después de iskay, la forma mostrada usa -nintin.', 'Conserva la secuencia nintin.'),
   choice('Qolqesapa se traduce en la lección como…',['Dinero grande, literalmente','Adinerado, que posee mucho dinero','Sin dinero'],'Adinerado, que posee mucho dinero','El sufijo destaca abundancia en este ejemplo. Su traducción depende de la base.', 'Piensa en abundancia.'),
   typing('Escribe el diminutivo documentado de alqo.', 'alqocha','Alqo-cha: perrito. Se escribe sin la tilde de posibilidad.', 'Usa -cha, sin tilde.'),
   choice('Sapa kuti significa…',['Cada vez','Boca grande','Los cuatro'],'Cada vez','Aquí sapa es palabra separada. No es la misma construcción que qolqe-sapa.', 'Kuti cuenta veces.')
  ]},
  {title:'Tu primera cima',source:'C04:14',vocab:['wasi','mama','noqa',"llank'ay"],guide:`<p>Reúne lo aprendido: <b>orden de la oración, posesión, relaciones y matices</b>.</p><div class="formula">Noqa <span>·</span> warmi-y-paq <span>·</span> munay wasi-ta <span>·</span> rantisaq</div><p>«Yo voy a comprar una hermosa casa para mi mujer.» El español reorganiza el orden. La beneficiaria aparece antes del objeto y el verbo queda al final.</p><p>Cuando encuentres una forma nueva, vuelve a la base en el diccionario y a la regla en la guía. Las notas de revisión ayudan a evitar equivalencias sin confirmar.</p>`,exercises:[
   order('Ordena el ejemplo: Yo voy a comprar una hermosa casa para mi mujer.', ['Noqa','warmiypaq','munay','wasita','rantisaq'],'El ejemplo de C04, p. 14 reúne beneficiario -paq, cualidad antes del nombre, objeto -ta y verbo final.', 'Yo → para mi esposa → hermosa → casa como objeto → compraré.'),
   typing('Noqa, pasado del modelo «trabajar».',"llank'arani",'Llank’a-ra-ni mantiene el pasado -ra- de la tabla del curso.', 'Raíz + ra + ni.'),
   choice('¿Cuál expresa «mis casas»?',['wasiykuna','wasinku','wasiyki'],'wasiykuna','-y es mi y -kuna pluraliza las casas. Wasinku indica un poseedor plural, no casas plurales.', 'Busca tanto posesión de primera persona como plural.'),
   choice('¿Cuál expresa posibilidad, conservando la grafía?', ['-cha','-chá','-kuna'],'-chá','La tilde distingue el sufijo de duda del diminutivo -cha.', 'La tilde es parte del significado.'),
   order('Ordena: Mi hermano vive en este pueblo con mi mamá.', ['Wayqey','kay','llaqtapi','mamaywan','tiyan'],'C04, pp. 4 y 14: lugar en -pi, compañía en -wan y verbo tiyan al final.', 'Sujeto → este pueblo (lugar) → compañía → verbo.')
  ]}
 ]}

 `<div class="lesson-grid">${UNITS.map((u,i)=>`<section class="card reference-card"><span class="pill green">ETAPA ${i+1} · ${u.source}</span><h3 style="margin-top:17px">${u.title}</h3><p>${u.desc}</p><button class="button light" data-action="unit-guide" data-unit="${i}">Leer explicación ${icon('book')}</button></section>`).join('')}</div><div class="card" style="margin-top:23px"><h3>La gramática maestra completa</h3><p class="small muted">Las 15 secciones de la guía de Nivel 2, con sus tablas, notas de revisión y referencias. La guía está incorporada en esta aplicación.</p><button class="button secondary" data-action="full-guide">Abrir guía completa ${icon('guide')}</button><div class="source-line" style="margin-top:20px"><span class="source-reference" title="Referencia del material de clase; archivo original no publicado">Documento maestro de gramática</span><span class="source-reference" title="Referencia del material de clase; archivo original no publicado">Documento maestro del diccionario</span></div></div><div class="notice" style="margin-top:23px"><p><b>Cómo se usa el material.</b> Los ejemplos y tablas conservan las grafías del curso. Las traducciones que aporta la guía se identifican como tales. El taller ofrece 38 verbos de los niveles 1 y 2 en pasado, presente y futuro. Distingue la tabla documentada de llank’ay de las formas de práctica que aplican ese modelo a las demás bases; cada base conserva su referencia de clase. Posesión ofrece 28 sustantivos y distingue la tabla de wasi de sus aplicaciones. Sufijos reúne 53 ejemplos de clase, filtrables por función y acompañados de su contexto.</p><p>Las entradas con notas de revisión siguen disponibles para consulta con sus fuentes. Las equivalencias dudosas no se usan como respuestas de vocabulario seguras. El contraste entre p'osqo en ambos niveles queda señalado.</p></div><div class="card" style="margin-top:23px"><h3>Materiales, derechos y referencias</h3><p class="small muted">Materiales de aprendizaje: Academia Mayor de la Lengua Quechua. Los derechos sobre los materiales corresponden a la Academia Mayor de la Lengua Quechua. Esta adaptación facilita su práctica; no atribuye la autoría de los contenidos a quien la comparte.</p><p class="small muted">Curso de Ronald Cjuyro Mescco. Las referencias N1 y C02–C06 conservan la lección y la página del material de clase. Los PDF originales no se distribuyen en esta beta. Las actividades, el diccionario y la guía incorporada pueden consultarse aquí.</p></div><div class="utilities"><button class="button light" data-action="help">Cómo usar la aplicación</button></div>`;
}

function beginSession(mode,lessonId,ids,previous=null){
 if($('dialog').open)$('dialog').close();
 if(session){showDialog('Hay una práctica en curso','<p>Puedes retomarla o empezar esta práctica. Si empiezas otra, se conservarán los puntos y repasos de las respuestas ya comprobadas.</p>',`<button class="button light" data-action="resume">Retomar</button><button class="button primary" data-action="replace-session" data-mode="${mode}" data-id="${lessonId}" data-ids="${escapeHtml(ids.join('|'))}" data-lab-mixed="${mode==='lab'&&previous?.labMixed===true?'true':'false'}">Empezar otra</button>`);return;}
 session={mode,lessonId,labMixed:mode==='lab'&&previous?.labMixed===true,ids:ids.slice(),scope:previous?.scope||ids.slice(),index:0,attempted:{},firstCorrect:0,correctSet:previous?.correctSet||[],errors:0,xp:0,selection:'',chosen:[],tokens:[],checked:false,answerCorrect:false,started:Date.now()};
 prepareQuestion();save();showSession();
}
function prepareQuestion(){session.selection='';session.chosen=[];session.checked=false;session.answerCorrect=false;const e=EXERCISES[session.ids[session.index]];session.tokens=e.type==='order'?shuffle(e.answer):e.type==='choice'?shuffle(e.options):[];}
function showSession(){if($('dialog').open)$('dialog').close();$('lesson-screen').hidden=false;$('app-shell').inert=true;document.body.style.overflow='hidden';renderExercise();}
function renderExercise(){
 if(!session)return;const e=EXERCISES[session.ids[session.index]],l=LESSONS.find(l=>l.id===e.lesson),retry=(session.attempted[e.id]||0)>0&&!session.checked;
 $('lesson-screen').innerHTML=`<div class="lesson-top"><button class="icon-button" data-action="exit-session" aria-label="Guardar y salir">${icon('close')}</button><div class="progress-track" role="progressbar" aria-label="Avance de la práctica" aria-valuenow="${session.index}" aria-valuemin="0" aria-valuemax="${session.ids.length}"><span style="width:${session.index/session.ids.length*100}%"></span></div><span class="lesson-count">${session.index+1} / ${session.ids.length}</span></div><div class="beta-exercise-credit">Materiales y derechos: Academia Mayor de la Lengua Quechua</div><section class="exercise-main"><div class="exercise-kicker">${icon(e.type==='order'?'tools':e.type==='choice'?'book':'bolt')} ${e.type==='order'?'ORDENA LAS PIEZAS':e.type==='choice'?'ELIGE UNA RESPUESTA':'ESCRIBE TU RESPUESTA'} ${session.labMixed===true?`<span class="session-pill">MIXTA · ${{conjugation:'CONJUGACIÓN',possession:'POSESIÓN',suffix:'SUFIJOS'}[e.labType]}</span>`:''} ${retry?'<span class="session-pill">UNA VUELTA MÁS</span>':''}</div><h1 id="exercise-heading" tabindex="-1">${escapeHtml(e.prompt)}</h1>
 <div id="exercise-interaction">${e.type==='choice'?`<div class="exercise-options">${session.tokens.map((o,i)=>`<button class="option ${session.selection===o?'selected':''} ${session.checked&&normalize(o)===normalize(e.answer)?'correct':''} ${session.checked&&session.selection===o&&!session.answerCorrect?'wrong':''}" data-action="choose" data-index="${i}" aria-pressed="${session.selection===o}" ${session.checked?'disabled':''}><span class="number">${i+1}</span>${escapeHtml(o)}</button>`).join('')}</div>`:e.type==='type'?`<label class="sr-only" for="answer-input">Tu respuesta</label><input class="answer-input" id="answer-input" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Escribe aquí…" value="${escapeHtml(session.selection)}" ${session.checked?'disabled':''}><div class="special-keys" aria-label="Letras y signos del curso">${["'",'á','é','í','ó','ú','ñ'].map(c=>`<button class="special-key" data-action="special-key" data-char="${escapeHtml(c)}" ${session.checked?'disabled':''}>${escapeHtml(c)}</button>`).join('')}</div>`:`<div class="answer-zone ${session.chosen.length?'':'empty'}" aria-label="Tu oración">${session.chosen.map((n,i)=>`<button class="token" data-action="remove-token" data-index="${i}" aria-label="Quitar ${escapeHtml(session.tokens[n])}" ${session.checked?'disabled':''}>${escapeHtml(session.tokens[n])}</button>`).join('')}</div><div class="token-bank" aria-label="Piezas disponibles">${session.tokens.map((t,i)=>`<button class="token ${session.chosen.includes(i)?'used':''}" data-action="add-token" data-index="${i}" ${session.checked||session.chosen.includes(i)?'disabled':''}>${escapeHtml(t)}</button>`).join('')}</div>`}</div>
 <div class="exercise-helpers"><button data-action="hint">${icon('bulb')} Una pista</button><button data-action="exercise-guide">${icon('guide')} Ver la regla</button><span class="source-line">${sourceLink(e.source)}</span></div><div id="hint-box" class="hint-box" hidden></div><div class="exercise-vocab"><span>${e.vocab?'CONSULTA LA BASE DEL TALLER':'CONSULTA TU VOCABULARIO DE NIVEL 1'}</span><div class="vocab-chips">${(e.vocab||l.vocab).slice(0,4).map(w=>`<button class="vocab-chip" data-action="lookup" data-word="${escapeHtml(w)}">${escapeHtml(w)}</button>`).join('')}</div></div></section>
 <footer class="exercise-footer ${session.checked?session.answerCorrect?'correct':'wrong':''}"><div class="exercise-footer-inner">${session.checked?`<div class="feedback" role="status"><strong>${session.answerCorrect?session.errors?'¡Bien! Sigue así.':'¡Muy bien!':'Vamos a mirarlo juntos.'}</strong>${!session.answerCorrect?`<p>Respuesta: <span class="solution">${escapeHtml(solutionText(e))}</span></p>`:''}<p>${escapeHtml(e.explain)}</p></div>`:'<div class="exercise-quiet">Cada intento te acerca un poco más.<br><span class="small">Enter para comprobar · 1–3 para elegir</span></div>'}<button id="check-answer" class="button primary" data-action="${session.checked?'continue':'check'}" ${!session.checked&&!hasAnswer()?'disabled':''}>${session.checked?'Continuar':'Comprobar'} ${icon('arrow')}</button></div></footer>`;
 if(session.checked)$('check-answer').focus({preventScroll:true});else $('exercise-heading').focus({preventScroll:true});
}
function solutionText(e){return Array.isArray(e.answer)?e.answer.join(e.type==='order'?' ':' / '):e.answer;}
function hasAnswer(){if(!session)return false;const e=EXERCISES[session.ids[session.index]];return e.type==='order'?session.chosen.length===e.answer.length:!!session.selection.trim();}
function answerValue(){const e=EXERCISES[session.ids[session.index]];return e.type==='order'?session.chosen.map(i=>session.tokens[i]).join(' '):session.selection;}
function matches(e,value){return(e.type==='type'&&Array.isArray(e.answer)?e.answer:[e.type==='order'?e.answer.join(' '):e.answer]).some(a=>normalize(a)===normalize(value));}
function checkAnswer(){
 if(!session||session.checked||!hasAnswer())return;
 const e=EXERCISES[session.ids[session.index]],correct=matches(e,answerValue()),attempts=session.attempted[e.id]||0;
 session.checked=true;session.answerCorrect=correct;session.attempted[e.id]=attempts+1;
 if(correct){if(attempts===0)session.firstCorrect++;if(!session.correctSet.includes(e.id))session.correctSet.push(e.id);}else{session.errors++;if(attempts===0)session.ids.push(e.id);}
 const reward=correct?10:0;session.xp+=reward;state.xp+=reward;const day=state.daily[dateKey()]||{xp:0,count:0};day.xp+=reward;day.count++;state.daily[dateKey()]=day;
 if(!e.id.startsWith('lab-')){const old=state.reviews[e.id]||{due:0,level:0,wrong:0},level=correct?Math.min(5,old.level+1):0;const intervals=[0,1,3,7,14,30];state.reviews[e.id]={due:Date.now()+(correct?intervals[level]*DAY:0),level,wrong:old.wrong+(correct?0:1),last:Date.now()};}
 save();renderHeader();renderExercise();
}
function continueSession(){if(!session?.checked)return;if(session.index+1<session.ids.length){session.index++;prepareQuestion();save();renderExercise();$('lesson-screen').scrollTop=0;}else finishSession();}
function finishSession(){
 const s=session,l=currentLesson(),unresolved=s.scope.filter(id=>!s.correctSet.includes(id)),complete=!unresolved.length,mixed=s.mode==='lab'&&s.labMixed===true;
 const firstTotal=Object.keys(s.attempted).length,accuracy=Math.round(s.firstCorrect/Math.max(1,firstTotal)*100),stars=accuracy===100?3:accuracy>=60?2:1;
 if(s.mode==='lesson'&&complete){const old=state.completions[l.id];state.completions[l.id]={best:Math.max(old?.best||0,accuracy),stars:Math.max(old?.stars||0,stars),at:Date.now()};}
 summary={...s,complete,unresolved,accuracy,stars,lid:l.id};session=null;save();renderHeader();
 const label=mixed?`PRÁCTICA MIXTA ${complete?'COMPLETADA':'REALIZADA'}`:`${s.mode==='lesson'?'PRÁCTICA':s.mode==='lab'?'TALLER':'REPASO'} ${complete?'COMPLETADO':'REALIZADO'}`;
 const primaryAction=!complete?'<button class="button primary" data-action="retry-unresolved">Reforzar estos retos</button>':mixed?'<button class="button primary" data-action="start-another-mixed">Otra mezcla de 10 retos</button>':s.mode==='lesson'?'<button class="button primary" data-action="next-from-summary">Siguiente práctica →</button>':'';
 const extraAction=mixed&&!complete?'<button class="button light" data-action="start-another-mixed">Otra mezcla de 10 retos</button>':'';
 $('lesson-screen').innerHTML=`<section class="summary-screen"><div class="trophy">${icon(complete?'trophy':'sprout')}</div><span class="eyebrow muted">${label}</span><h1 style="margin:13px 0">${complete?'Un paso más en tu camino.':'La práctica ya está dando frutos.'}</h1><p>${complete?s.mode==='lesson'?`${l.title}: completaste todos los retos, incluidos los que repasaste.`:mixed?'Terminaste la mezcla de conjugación, posesión y sufijos. Tus puntos ya están guardados.':'Terminaste esta sesión. Tus puntos ya están guardados.':`Quedan ${unresolved.length} retos por afianzar. Puedes darles otra vuelta con las pistas y la regla.`}</p><div class="summary-stats"><div class="summary-stat"><strong>+${s.xp}</strong><span>XP ganados</span></div><div class="summary-stat"><strong>${accuracy}%</strong><span>A la primera</span></div><div class="summary-stat"><strong>${s.scope.length-unresolved.length}/${s.scope.length}</strong><span>Retos resueltos</span></div></div><div class="lesson-actions">${primaryAction}${extraAction}<button class="button ${primaryAction?'light':'primary'}" data-action="close-summary">${s.mode==='lab'?'Volver al taller':'Volver al recorrido'}</button></div><p class="backup-note">${storageAvailable?'Tu progreso está guardado en este navegador.':'Recuerda descargar una copia desde Mi progreso.'}</p><p class="mixed-summary-source">Materiales y derechos: Academia Mayor de la Lengua Quechua.</p></section>`;
 $('lesson-screen').scrollTop=0;$('lesson-screen').querySelector('button').focus();
}
function closeSession(){session=session||null;save();$('lesson-screen').hidden=true;$('app-shell').inert=false;document.body.style.overflow='';render();$('main').focus({preventScroll:true});}

function exportProgress(){const payload={...state,app:'Quechua Interactivo',version:1,session:null,exportedAt:new Date().toISOString()};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`quechua-progreso-${dateKey()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Copia descargada. Guárdala para recuperar tu progreso.');}
let pendingImport=null;
async function readImport(file){if(!file)return;try{if(file.size>3e6)throw new Error('La copia es demasiado grande.');pendingImport=validateState(JSON.parse(await file.text()),true);showDialog('Recuperar tu progreso',`<p>Esta copia contiene <b>${pendingImport.xp} XP</b>, <b>${Object.keys(pendingImport.completions).length} prácticas</b> completadas y <b>${pendingImport.favorites.length} entradas</b> guardadas.</p><p>Al recuperarla se reemplazará el progreso de este navegador. Puedes descargar primero una copia del progreso actual.</p>`,`<button class="button light" data-action="export">Descargar copia actual</button><button class="button light" data-action="close-dialog">Cancelar</button><button class="button primary" data-action="confirm-import">Recuperar esta copia</button>`);}catch(e){toast(e.message||'No se pudo leer esa copia.');}$('import-file').value='';}

document.addEventListener('click',event=>{
 const b=event.target.closest('button,[data-view]');if(!b||b.disabled)return;
 if(b.dataset.view){navigate(b.dataset.view);return;}
 const a=b.dataset.action,id=b.dataset.id;
 if(a==='unit'){selectedUnit=Number(b.dataset.unit);renderPath();}
 else if(a==='start-next')openLesson(nextLesson().id);
 else if(a==='lesson')openLesson(id);
 else if(a==='begin-lesson'){const l=LESSONS.find(l=>l.id===id);beginSession('lesson',id,l.exercises.map(e=>e.id));}
 else if(a==='unit-guide')unitGuide(Number(b.dataset.unit));
 else if(a==='close-dialog')$('dialog').close();
 else if(a==='lookup')lookup(b.dataset.word);
 else if(a==='open-dictionary'){$('dialog').close();closeSessionIfNeeded();dict={query:b.dataset.word,kind:'all',topic:'',page:0,saved:false};navigate('dictionary');}
 else if(a==='favorite'){const at=state.favorites.indexOf(id);if(at===-1)state.favorites.push(id);else state.favorites.splice(at,1);save();b.classList.toggle('saved',at===-1);b.setAttribute('aria-pressed',at===-1?'true':'false');b.setAttribute('aria-label',`${at===-1?'Quitar de':'Añadir a'} guardadas: ${ENTRY_MAP[id].q}`);if(dict.saved&&currentView==='dictionary'&&!$('dialog').open)renderDictionaryResults();}
 else if(a==='clear-search'){dict.query='';dict.page=0;$('dictionary-search').value='';renderDictionaryResults();$('dictionary-search').focus();}
 else if(a==='dict-kind'){dict.kind=b.dataset.kind;dict.topic='';dict.page=0;renderDictionary();}
 else if(a==='dict-saved'){dict.saved=!dict.saved;dict.page=0;renderDictionary();}
 else if(a==='dict-page'){dict.page+=Number(b.dataset.dir);renderDictionaryResults();$('dictionary-search').scrollIntoView({block:'start'});}
 else if(a==='saved-words'){dict={query:'',kind:'all',topic:'',page:0,saved:true};navigate('dictionary');}
 else if(a==='start-review'){const ids=dueReviews().sort((a,b)=>state.reviews[a].due-state.reviews[b].due).slice(0,10);if(ids.length)beginSession('review',EXERCISES[ids[0]].lesson,ids);}
 else if(a==='free-review'){const ids=shuffle(LESSONS.flatMap(l=>l.exercises.map(e=>e.id))).slice(0,10);beginSession('review',EXERCISES[ids[0]].lesson,ids);}
 else if(a==='lab-tab'){lab.tab=b.dataset.tab;renderLab();}
 else if(a==='lab-practice')labPractice();
 else if(a==='lab-mixed')startMixedLab();
 else if(a==='start-another-mixed'){summary=null;startMixedLab();}
 else if(a==='full-guide')showDialog('Gramática maestra · Nivel 2',`<article class="master-guide">${COURSE.grammarHtml}</article>`,`<button class="button primary" data-action="close-dialog">Cerrar guía</button>`,true);
 else if(a==='resume'){if($('dialog').open)$('dialog').close();if(session)showSession();}
 else if(a==='replace-session'){session=null;beginSession(b.dataset.mode,id,b.dataset.ids.split('|'),{labMixed:b.dataset.labMixed==='true'});}
 else if(a==='exit-session'){const mixed=session?.labMixed===true;if(mixed)currentView='lab';closeSession();toast(mixed?'Práctica mixta guardada. Puedes retomarla desde el taller.':'Práctica guardada. Puedes retomarla desde el recorrido.');}
 else if(a==='choose'){session.selection=session.tokens[Number(b.dataset.index)];save();renderExercise();}
 else if(a==='add-token'){if(!session.checked){session.chosen.push(Number(b.dataset.index));save();renderExercise();}}
 else if(a==='remove-token'){if(!session.checked){session.chosen.splice(Number(b.dataset.index),1);save();renderExercise();}}
 else if(a==='special-key'){const el=$('answer-input'),start=el.selectionStart,end=el.selectionEnd;el.value=el.value.slice(0,start)+b.dataset.char+el.value.slice(end);session.selection=el.value;el.focus();el.setSelectionRange(start+1,start+1);$('check-answer').disabled=!hasAnswer();save();}
 else if(a==='hint'){const el=$('hint-box');el.textContent=EXERCISES[session.ids[session.index]].hint;el.hidden=!el.hidden;}
 else if(a==='exercise-guide')showExerciseGuide();
 else if(a==='check')checkAnswer();
 else if(a==='continue')continueSession();
 else if(a==='close-summary'){currentView=summary?.mode==='lab'?'lab':'path';summary=null;closeSession();}
 else if(a==='next-from-summary'){const l=LESSONS.find(l=>l.id===summary?.lid);summary=null;closeSession();openLesson(LESSONS[(LESSONS.indexOf(l)+1)%LESSONS.length].id);}
 else if(a==='retry-unresolved'){const old=summary;summary=null;beginSession(old.mode,old.lid,old.unresolved,{scope:old.scope,correctSet:old.correctSet,labMixed:old.labMixed});}
 else if(a==='export')exportProgress();
 else if(a==='import')$('import-file').click();
 else if(a==='confirm-import'&&pendingImport){state=pendingImport;pendingImport=null;session=null;save();$('dialog').close();render();toast('Progreso recuperado.');}
 else if(a==='reset')showDialog('Reiniciar el progreso','<p>Se borrarán los puntos, prácticas completadas, repasos y palabras guardadas de este navegador. Descarga una copia si quieres recuperarlos después.</p>',`<button class="button light" data-action="close-dialog">Cancelar</button><button class="button light" data-action="export">Descargar copia</button><button class="button danger" data-action="confirm-reset">Reiniciar ahora</button>`);
 else if(a==='confirm-reset'){state=defaultState();session=null;save();$('dialog').close();render();toast('Progreso reiniciado.');}
 else if(a==='help')showDialog('Un camino para estudiar a tu ritmo',`<div class="guide-copy"><p><b>1. Recorre las etapas.</b> Lee una explicación y practica cinco retos. Puedes visitar cualquier etapa. La sugerencia sigue el orden del recorrido.</p><p><b>2. Comprueba y comprende.</b> Cada respuesta incluye una explicación. Los errores reaparecen una vez al final. Si aún quedan dudas, puedes reforzarlas antes de completar la práctica.</p><p><b>3. Consulta y aplica.</b> Las palabras de apoyo abren el diccionario de Nivel 1. En el taller puedes explorar el modelo de conjugación, posesivos y ejemplos de sufijos.</p><p><b>4. Vuelve después.</b> Los repasos siguen intervalos de 1, 3, 7, 14 y 30 días. Los errores quedan pendientes de inmediato.</p><p><b>5. Conserva tu progreso.</b> Abre siempre el mismo HTML en el mismo navegador. Descarga una copia desde Mi progreso para cambiar de navegador o equipo.</p><p>Atajos: <b>Enter</b> comprueba o continúa; <b>1–3</b> seleccionan opciones. Los botones de letras permiten insertar apóstrofos, tildes y ñ. No hay audio incorporado.</p></div>`,`<button class="button primary" data-action="close-dialog">Empezar</button>`);
});
function closeSessionIfNeeded(){if(!$('lesson-screen').hidden)closeSession();}
document.addEventListener('input',event=>{if(event.target.id==='dictionary-search'){dict.query=event.target.value;dict.page=0;renderDictionaryResults();}if(event.target.id==='answer-input'&&session&&!session.checked){session.selection=event.target.value;$('check-answer').disabled=!hasAnswer();save();}});
document.addEventListener('change',event=>{const el=event.target;if(el.id==='dictionary-topic'){dict.topic=el.value;dict.page=0;renderDictionaryResults();}if(el.id==='lab-verb'){lab.verb=el.value;renderLabContent();}if(el.id==='lab-noun'){lab.noun=el.value;renderLabContent();}if(el.id==='lab-suffix-group'){lab.suffixGroup=el.value;renderLabContent();}if(el.id==='lab-person'){lab.person=Number(el.value);renderLabContent();}if(el.id==='lab-tense'){lab.tense=el.value;renderLabContent();}if(el.id==='lab-sample'){lab.sample=Number(el.value);renderLabContent();}if(el.id==='import-file')readImport(el.files[0]);});
document.addEventListener('keydown',event=>{if(!session||$('lesson-screen').hidden||$('dialog').open||event.altKey||event.ctrlKey||event.metaKey)return;const e=EXERCISES[session.ids[session.index]];if(event.key==='Enter'){event.preventDefault();if(session.checked)continueSession();else checkAnswer();}else if(/^[1-3]$/.test(event.key)&&e.type==='choice'&&!session.checked&&event.target.tagName!=='INPUT'){const i=Number(event.key)-1;if(session.tokens[i]){session.selection=session.tokens[i];save();renderExercise();}}});
window.addEventListener('pagehide',()=>{if(session)save();});
selectedUnit=nextLesson().ui;render();

document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));
</script>
