":"Undécimo / décimo primero · 11.º","topic":"Números: ordinales","kind":"number","source":"12, p. 13","refs":[{"lesson":"12","page":13}],"notes":[]},{"id":"w1041","q":"chunka iskayniyuq ñeqe","es":"Duodécimo / décimo segundo · 12.º","topic":"Números: ordinales","kind":"number","source":"12, p. 14","refs":[{"lesson":"12","page":14}],"notes":[]},{"id":"w1042","q":"iskay chunka ñeqe","es":"Vigésimo · 20.º","topic":"Números: ordinales","kind":"number","source":"12, p. 14","refs":[{"lesson":"12","page":14}],"notes":[]},{"id":"w1043","q":"kinsa chunka ñeqe","es":"Trigésimo · 30.º","topic":"Números: ordinales","kind":"number","source":"12, p. 14","refs":[{"lesson":"12","page":14}],"notes":[]},{"id":"w1044","q":"tawa chunka ñeqe","es":"Cuadragésimo · 40.º","topic":"Números: ordinales","kind":"number","source":"12, p. 14","refs":[{"lesson":"12","page":14}],"notes":[]},{"id":"w1045","q":"pisqa chunka ñeqe","es":"Quincuagésimo · 50.º","topic":"Números: ordinales","kind":"number","source":"12, p. 14","refs":[{"lesson":"12","page":14}],"notes":[]},{"id":"w1046","q":"soqta chunka ñeqe","es":"Sexagésimo · 60.º","topic":"Números: ordinales","kind":"number","source":"12, p. 14","refs":[{"lesson":"12","page":14}],"notes":[]},{"id":"w1047","q":"qanchis chunka ñeqe","es":"Septuagésimo · 70.º","topic":"Números: ordinales","kind":"number","source":"12, p. 14","refs":[{"lesson":"12","page":14}],"notes":[]},{"id":"w1048","q":"pusaq chunka ñeqe","es":"Octogésimo · 80.º","topic":"Números: ordinales","kind":"number","source":"12, p. 14","refs":[{"lesson":"12","page":14}],"notes":[]},{"id":"w1049","q":"isqon chunka ñeqe","es":"Nonagésimo · 90.º","topic":"Números: ordinales","kind":"number","source":"12, p. 14","refs":[{"lesson":"12","page":14}],"notes":[]},{"id":"w1050","q":"pachak ñeqe","es":"Centésimo · 100.º","topic":"Números: ordinales","kind":"number","source":"12, p. 14","refs":[{"lesson":"12","page":14}],"notes":[]},{"id":"w1051","q":"iskay pachak ñeqe","es":"Ducentésimo · 200.º","topic":"Números: ordinales","kind":"number","source":"12, p. 14","refs":[{"lesson":"12","page":14}],"notes":[]},{"id":"w1052","q":"kinsa pachak ñeqe","es":"Tricentésimo · 300.º","topic":"Números: ordinales","kind":"number","source":"12, p. 14","refs":[{"lesson":"12","page":14}],"notes":[]}],"sources1":{},"sources2":{},"notes1":{"R1":"El PDF 03, p. 9 imprime «Isaño - Año» y el PDF 10, p. 3 imprime «MASHWA/ISAÑO - Año». Se conserva constancia de la glosa, pero su traducción queda pendiente. wata aparece como «año» dentro de *kay wata* y otras expresiones del curso.","R2":"El PDF 08 lo traduce como «glotis» en la p. 6 y «esófago» en la p. 9. Son dos equivalencias anatómicas diferentes; conviene confirmarlas con el docente.","R3":"Aparece como «candado» en 03, p. 12 y como «brazalete» en 09, p. 2. Se registran ambos contextos sin decidir si se trata de polisemia o de una errata.","R4":"Los PDF ofrecen grafías diferentes para equivalencias iguales o próximas. Se mantienen separadas. En particular, no se elimina una aspiración ni se cambia una vocal para uniformarlas.","R5":"Diferencias de escritura entre tablas, rótulos o lecciones. En el último caso se conservan las expresiones de parentesco con *sulk'a* del PDF 04 y las formas de extremidades con *sullk'a* del PDF 08. Las entradas cercanas no se presentan como sinónimos confirmados fuera de su contexto.","R6":"pitita significa «tabique» en 08, p. 4; p'itita significa «ambiente, habitación, salón de clases» en 06, p. 4. Se conserva la diferencia del apóstrofo.","R7":"Se reúnen las acepciones que el material asigna a cada forma, indicando el tema. Ejemplos: *yana*, «negro» y «mi enamorado(a)»; *chupi*, «sopa» y «vagina»; *moqo*, «cerro/morro» y «rodilla». No se sustituyen unas por otras.","R8":"«Árbol frutal» en 05, p. 4 y «Dios de los muertos» en el relato cultural de 11, p. 5. El segundo uso se conserva con su contexto y no como definición general independiente.","R9":"La tabla de 07, p. 4 dice «avestruz», mientras que la lámina de 07, p. 1 dice «ñandú andino». Se conserva la diferencia de las dos páginas.","R10":"El PDF 10, p. 6 reúne «masa con harina de trigo o cebada» y «mate de hinojo» en la misma celda. No se resuelve aquí si la segunda glosa corresponde a la misma entrada.","R11":"Se transcribe «invierno», tal como aparece en 11, pp. 7-8. Esta equivalencia permanece atribuida al curso y no se generaliza a otras variedades o calendarios.","R12":"El PDF 13 presenta «sacerdote andino» para la primera forma (p. 6) y «pontífice» para la segunda (p. 7). Se mantienen ambas grafías y sus respectivas glosas."},"grammarHtml":"<h1>Gramática maestra de quechua - Nivel 2<\/h1>\n<p>Explicaciones en español y ejemplos de las seis lecciones de <strong>nivel2<\/strong>, fechadas del <strong>5 al 16 de octubre de 2026<\/strong>. Material de la Academia Mayor de la Lengua Quechua; docente: <strong>Ronald Cjuyro Mescco<\/strong>. Se revisaron los <strong>6 PDF completos, con 98 páginas en total<\/strong>.<\/p>\n<h2>Cómo leer esta guía<\/h2>\n<p>Esta guía reorganiza lo trabajado en clase por temas: primero la estructura de la oración y la conjugación; después el sustantivo, la posesión, los sufijos y los adjetivos. Los contenidos repetidos entre lecciones aparecen reunidos.<\/p>\n<ul>\n<li><strong>Fuente:<\/strong> <code>C04, p. 5<\/code> significa clase 4, quinta página física del PDF. Los enlaces conducen a la lista de <a href=\"#fuentes\">fuentes<\/a>, desde donde se abre cada archivo original.<\/li>\n<li><strong>PDF:<\/strong> traducción que aparece en la lección, con correcciones de ortografía o puntuación del español cuando hacen falta.<\/li>\n<li><strong>Guía:<\/strong> traducción o explicación pedagógica añadida aquí. Es una lectura contextual del ejemplo de clase; no una traducción impresa en el PDF.<\/li>\n<li><strong>Segmentación:<\/strong> los guiones separan partes para estudiarlas: <code>wasi-y-kuna<\/code>. En los ejemplos originales estas partes se escriben juntas: <code>wasiykuna<\/code>.<\/li>\n<li><strong>Escritura:<\/strong> se conservan las grafías del curso, incluidas las cinco vocales, <code>noqa<\/code>, <code>qan<\/code>, <code>-nchis<\/code>, <code>-nkichis<\/code>, los apóstrofos y las tildes de <code>-chá<\/code>, <code>-yá<\/code> y <code>-má<\/code>. Solo se uniforman mayúsculas, espacios y apóstrofos tipográficos.<\/li>\n<li><strong>Aclaración editorial:<\/strong> distingue una regla útil de una simplificación o contradicción de las diapositivas. Las comprobaciones externas se limitan a las notas expresamente identificadas; los ejemplos proceden de las lecciones locales.<\/li>\n<\/ul>\n<p>Las tablas reúnen las formas enseñadas, sin completar paradigmas que no aparecen en los PDF. Las dudas que requieren confirmación están en <a href=\"#revision\">Notas de revisión<\/a>.<\/p>\n<h2>Índice<\/h2>\n<ol>\n<li><a href=\"#escritura\">Escritura y sonidos: recordatorio del curso<\/a><\/li>\n<li><a href=\"#oracion\">Cómo se construye una oración<\/a><\/li>\n<li><a href=\"#verbos\">Pronombres, verbos y conjugación<\/a><\/li>\n<li><a href=\"#sustantivo\">El sustantivo: número, género y clasificación<\/a><\/li>\n<li><a href=\"#posesion\">La posesión: mi casa, tu casa, nuestras casas<\/a><\/li>\n<li><a href=\"#sufijos-caso\">Sufijos de relación, lugar, dirección y finalidad<\/a><\/li>\n<li><a href=\"#matices\">Énfasis, preguntas, negación y otros matices<\/a><\/li>\n<li><a href=\"#adjetivos\">El adjetivo y sus clases<\/a><\/li>\n<li><a href=\"#numerales\">Numerales, frecuencia, conjuntos y procedencia<\/a><\/li>\n<li><a href=\"#derivacion\">Abundancia, aumentativos y diminutivos<\/a><\/li>\n<li><a href=\"#lecturas\">Lectura comentada de ejemplos completos<\/a><\/li>\n<li><a href=\"#dialogo\">El diálogo de presentación como repaso<\/a><\/li>\n<li><a href=\"#indice-formas\">Índice rápido de formas gramaticales<\/a><\/li>\n<li><a href=\"#revision\">Notas de revisión<\/a><\/li>\n<li><a href=\"#fuentes\">Fuentes y cobertura de las lecciones<\/a><\/li>\n<\/ol>\n<p><a id=\"escritura\"><\/a><\/p>\n<h2>1. Escritura y sonidos: recordatorio del curso<\/h2>\n<p>Las clases trabajan con las vocales <strong>a, e, i, o, u<\/strong> y distinguen consonantes simples, aspiradas y glotalizadas. El apóstrofo forma parte de la escritura y debe conservarse. Esta es la convención de las diapositivas que se mantiene en esta guía. <a href=\"#fuente-01\">C01, pp. 4-5<\/a>; <a href=\"#fuente-02\">C02-C06, p. 2<\/a>.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Serie<\/th>\n  <th>Simple<\/th>\n  <th>Aspirada<\/th>\n  <th>Glotalizada<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>CH<\/td>\n  <td>ch<\/td>\n  <td>chh<\/td>\n  <td>ch'<\/td>\n<\/tr>\n<tr>\n  <td>K<\/td>\n  <td>k<\/td>\n  <td>kh<\/td>\n  <td>k'<\/td>\n<\/tr>\n<tr>\n  <td>P<\/td>\n  <td>p<\/td>\n  <td>ph<\/td>\n  <td>p'<\/td>\n<\/tr>\n<tr>\n  <td>T<\/td>\n  <td>t<\/td>\n  <td>th<\/td>\n  <td>t'<\/td>\n<\/tr>\n<tr>\n  <td>Q<\/td>\n  <td>q<\/td>\n  <td>qh<\/td>\n  <td>q'<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Las láminas también enumeran <code>h, l, ll, m, n, ñ, r, s, sh, w, y<\/code> como consonantes simples y <code>j, f<\/code> como auxiliares. El propósito de este recordatorio es leer los ejemplos sin perder diferencias gráficas; no se desarrolla aquí una fonología completa. <a href=\"#fuente-01\">C01, p. 5<\/a>.<\/p>\n<p><a id=\"oracion\"><\/a><\/p>\n<h2>2. Cómo se construye una oración<\/h2>\n<h3>2.1. Raíz y sufijos<\/h3>\n<p>Los ejemplos muestran que una palabra puede reunir una base y varias marcas gramaticales. Para entenderla conviene reconocer <strong>qué palabra es la base<\/strong> y <strong>qué aporta cada terminación<\/strong>.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Forma de la lección<\/th>\n  <th>Segmentación para estudiar<\/th>\n  <th>Lectura<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>wasiy<\/code><\/td>\n  <td><code>wasi-y<\/code><\/td>\n  <td>Mi casa.<\/td>\n<\/tr>\n<tr>\n  <td><code>wasiykuna<\/code><\/td>\n  <td><code>wasi-y-kuna<\/code><\/td>\n  <td>Mis casas: base + poseedor + plural.<\/td>\n<\/tr>\n<tr>\n  <td><code>llank'ani<\/code><\/td>\n  <td><code>llank'a-ni<\/code><\/td>\n  <td>Trabajo: raíz verbal + primera persona.<\/td>\n<\/tr>\n<tr>\n  <td><code>llank'arani<\/code><\/td>\n  <td><code>llank'a-ra-ni<\/code><\/td>\n  <td>Trabajé: raíz + pasado + primera persona.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Las dos primeras equivalencias aparecen en el PDF; las segmentaciones y las traducciones verbales son explicaciones de esta guía. <a href=\"#fuente-06\">C06, p. 14<\/a>; <a href=\"#fuente-02\">C02, p. 30<\/a>.<\/p>\n<h3>2.2. Orden de referencia: sujeto + objeto/complemento + verbo<\/h3>\n<p>La clase presenta el esquema <strong>SOV<\/strong>: sujeto, objeto o complemento, verbo. Lo denomina también <code>Runa + Hunt'apa + Ruwachiq (RHR)<\/code>. <a href=\"#fuente-02\">C02, p. 28<\/a>; <a href=\"#fuente-03\">C03, p. 5<\/a>.<\/p>\n<blockquote>\n<p><strong>Ronald wakanta michin.<\/strong><br />\n<strong>PDF:<\/strong> Ronald pastea su vaca.<\/p>\n<\/blockquote>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Parte<\/th>\n  <th>Función en el ejemplo<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>Ronald<\/code><\/td>\n  <td>Sujeto: quien realiza la acción.<\/td>\n<\/tr>\n<tr>\n  <td><code>wakanta<\/code><\/td>\n  <td>Objeto: su vaca. Para estudiar: <code>waka-n-ta<\/code>, vaca + su + objeto.<\/td>\n<\/tr>\n<tr>\n  <td><code>michin<\/code><\/td>\n  <td>Verbo al final. Para estudiar: <code>michi-n<\/code>, pastea.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>El ejemplo permite reconocer dos funciones diferentes de <code>-n<\/code>: posesión en <code>waka-n<\/code> y persona verbal en <code>michi-n<\/code>. Se estudia el orden presentado por el curso; no se establece que todas las oraciones deban tener tres elementos expresos.<\/p>\n<h3>2.3. Adjetivo antes del sustantivo<\/h3>\n<p>En los grupos nominales de la lección, la cualidad precede al nombre:<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Quechua<\/th>\n  <th>Español del PDF<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>Yana alqo<\/code><\/td>\n  <td>Perro negro.<\/td>\n<\/tr>\n<tr>\n  <td><code>Llasa rumi<\/code><\/td>\n  <td>Piedra pesada.<\/td>\n<\/tr>\n<tr>\n  <td><code>Sumaq aycha<\/code><\/td>\n  <td>Rica carne.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Así, el orden para estos ejemplos es <strong>adjetivo + sustantivo<\/strong>. <a href=\"#fuente-06\">C06, p. 5<\/a>.<\/p>\n<p><a id=\"verbos\"><\/a><\/p>\n<h2>3. Pronombres, verbos y conjugación<\/h2>\n<h3>3.1. Pronombres de la tabla de conjugación<\/h3>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Pronombre<\/th>\n  <th>Persona<\/th>\n  <th>Equivalencia para estudiar<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>noqa<\/code><\/td>\n  <td>Primera singular<\/td>\n  <td>Yo.<\/td>\n<\/tr>\n<tr>\n  <td><code>qan<\/code><\/td>\n  <td>Segunda singular<\/td>\n  <td>Tú.<\/td>\n<\/tr>\n<tr>\n  <td><code>pay<\/code><\/td>\n  <td>Tercera singular<\/td>\n  <td>Él, ella.<\/td>\n<\/tr>\n<tr>\n  <td><code>noqanchis<\/code><\/td>\n  <td>Primera plural incluyente<\/td>\n  <td>Nosotros o nosotras, incluyendo al interlocutor.<\/td>\n<\/tr>\n<tr>\n  <td><code>noqayku<\/code><\/td>\n  <td>Primera plural excluyente<\/td>\n  <td>Nosotros o nosotras, sin incluir al interlocutor.<\/td>\n<\/tr>\n<tr>\n  <td><code>qankuna<\/code><\/td>\n  <td>Segunda plural<\/td>\n  <td>Ustedes.<\/td>\n<\/tr>\n<tr>\n  <td><code>paykuna<\/code><\/td>\n  <td>Tercera plural<\/td>\n  <td>Ellos, ellas.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>La lista de formas procede de <a href=\"#fuente-02\">C02, p. 30<\/a>. Las equivalencias españolas y la explicación de la inclusión son glosas de esta guía. La distinción se conserva también en la <a href=\"#posesion\">posesión<\/a>.<\/p>\n<h3>3.2. Infinitivo y raíz de trabajo<\/h3>\n<p>La serie de verbos aparece bajo los rótulos <code>simichaqkuna / ruwachiqkuna<\/code>. En el modelo <strong>llank'ay<\/strong>, se reconoce <code>llank'a-<\/code> como base de las formas conjugadas. El infinitivo termina en <code>-y<\/code>; en la tabla esa terminación se sustituye por las marcas de la forma verbal. <a href=\"#fuente-02\">C02, pp. 5-6, 30<\/a>.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Forma<\/th>\n  <th>Lectura de la guía<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>llank'ay<\/code><\/td>\n  <td>Trabajar; infinitivo.<\/td>\n<\/tr>\n<tr>\n  <td><code>llank'a-<\/code><\/td>\n  <td>Raíz que reaparece en la conjugación.<\/td>\n<\/tr>\n<tr>\n  <td><code>llank'a-ni<\/code><\/td>\n  <td>Yo trabajo.<\/td>\n<\/tr>\n<tr>\n  <td><code>llank'a-ra-ni<\/code><\/td>\n  <td>Yo trabajé.<\/td>\n<\/tr>\n<tr>\n  <td><code>llank'a-saq<\/code><\/td>\n  <td>Yo trabajaré.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>3.3. Conjugación completa de <strong>llank'ay<\/strong><\/h3>\n<p>Las formas quechuas siguientes se transcriben de la tabla. Sus equivalencias españolas se añaden como <strong>Guía<\/strong>. Se conserva el pasado con <code>-ra-<\/code> y las dos variantes del futuro incluyente que presenta la lección. <a href=\"#fuente-02\">C02, p. 30<\/a>.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Pronombre<\/th>\n  <th>Pasado: <code>ripuq pacha<\/code><\/th>\n  <th>Presente: <code>kunan pacha<\/code><\/th>\n  <th>Futuro: <code>hamuq pacha<\/code><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>noqa<\/code><\/td>\n  <td><code>llank'arani<\/code> - trabajé<\/td>\n  <td><code>llank'ani<\/code> - trabajo<\/td>\n  <td><code>llank'asaq<\/code> - trabajaré<\/td>\n<\/tr>\n<tr>\n  <td><code>qan<\/code><\/td>\n  <td><code>llank'aranki<\/code> - trabajaste<\/td>\n  <td><code>llank'anki<\/code> - trabajas<\/td>\n  <td><code>llank'anki<\/code> - trabajarás<\/td>\n<\/tr>\n<tr>\n  <td><code>pay<\/code><\/td>\n  <td><code>llank'aran<\/code> - trabajó<\/td>\n  <td><code>llank'an<\/code> - trabaja<\/td>\n  <td><code>llank'anqa<\/code> - trabajará<\/td>\n<\/tr>\n<tr>\n  <td><code>noqanchis<\/code><\/td>\n  <td><code>llank'aranchis<\/code> - trabajamos<\/td>\n  <td><code>llank'anchis<\/code> - trabajamos<\/td>\n  <td><code>llank'asunchis / llank'asun<\/code> - trabajaremos<\/td>\n<\/tr>\n<tr>\n  <td><code>noqayku<\/code><\/td>\n  <td><code>llank'arayku<\/code> - trabajamos<\/td>\n  <td><code>llank'ayku<\/code> - trabajamos<\/td>\n  <td><code>llank'asaqku<\/code> - trabajaremos<\/td>\n<\/tr>\n<tr>\n  <td><code>qankuna<\/code><\/td>\n  <td><code>llank'arankichis<\/code> - trabajaron ustedes<\/td>\n  <td><code>llank'ankichis<\/code> - trabajan ustedes<\/td>\n  <td><code>llank'ankichis<\/code> - trabajarán ustedes<\/td>\n<\/tr>\n<tr>\n  <td><code>paykuna<\/code><\/td>\n  <td><code>llank'aranku<\/code> - trabajaron<\/td>\n  <td><code>llank'anku<\/code> - trabajan<\/td>\n  <td><code>llank'anqaku<\/code> - trabajarán<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Cómo leer la tabla:<\/strong> en este paradigma el presente utiliza las terminaciones <code>-ni, -nki, -n, -nchis, -yku, -nkichis, -nku<\/code>. El pasado inserta <code>-ra-<\/code> antes de ellas. En el futuro se estudian las formas completas de cada fila: no hay una única terminación que se añada por igual a todas las personas.<\/p>\n<p><strong>Coincidencia de formas:<\/strong> <code>llank'anki<\/code> y <code>llank'ankichis<\/code> aparecen tanto en presente como en futuro. La propia tabla obliga a atender al contexto temporal; no se debe cambiar su escritura para fabricar una diferencia que la lección no hace.<\/p>\n<h3>3.4. Verbos disponibles para practicar<\/h3>\n<p>Son los infinitivos enseñados antes de la conjugación; sus traducciones proceden del PDF. Esta lista ofrece bases de práctica, sin añadir tablas de conjugación que no están en las diapositivas.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Infinitivo<\/th>\n  <th>Español<\/th>\n  <th>Fuente<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>llank'ay<\/code><\/td>\n  <td>Trabajar.<\/td>\n  <td><a href=\"#fuente-02\">C02, p. 6<\/a><\/td>\n<\/tr>\n<tr>\n  <td><code>tusuy<\/code><\/td>\n  <td>Bailar.<\/td>\n  <td><a href=\"#fuente-02\">C02, p. 7<\/a><\/td>\n<\/tr>\n<tr>\n  <td><code>takiy<\/code><\/td>\n  <td>Cantar.<\/td>\n  <td><a href=\"#fuente-02\">C02, p. 8<\/a><\/td>\n<\/tr>\n<tr>\n  <td><code>puriy<\/code><\/td>\n  <td>Caminar.<\/td>\n  <td><a href=\"#fuente-02\">C02, p. 9<\/a><\/td>\n<\/tr>\n<tr>\n  <td><code>puñuy<\/code><\/td>\n  <td>Dormir.<\/td>\n  <td><a href=\"#fuente-02\">C02, p. 10<\/a><\/td>\n<\/tr>\n<tr>\n  <td><code>pujllay<\/code><\/td>\n  <td>Jugar.<\/td>\n  <td><a href=\"#fuente-02\">C02, p. 11<\/a><\/td>\n<\/tr>\n<tr>\n  <td><code>wichay<\/code><\/td>\n  <td>Subir.<\/td>\n  <td><a href=\"#fuente-02\">C02, p. 12<\/a><\/td>\n<\/tr>\n<tr>\n  <td><code>urayuy<\/code><\/td>\n  <td>Bajar; grafía del material.<\/td>\n  <td><a href=\"#fuente-02\">C02, p. 13<\/a><\/td>\n<\/tr>\n<tr>\n  <td><code>asnay<\/code><\/td>\n  <td>Apestar.<\/td>\n  <td><a href=\"#fuente-02\">C02, p. 14<\/a><\/td>\n<\/tr>\n<tr>\n  <td><code>ayqey<\/code><\/td>\n  <td>Huir, evadir.<\/td>\n  <td><a href=\"#fuente-02\">C02, p. 15<\/a><\/td>\n<\/tr>\n<tr>\n  <td><code>allichay<\/code><\/td>\n  <td>Arreglar.<\/td>\n  <td><a href=\"#fuente-02\">C02, p. 16<\/a><\/td>\n<\/tr>\n<tr>\n  <td><code>iñiy<\/code><\/td>\n  <td>Creer, tener fe.<\/td>\n  <td><a href=\"#fuente-02\">C02, p. 17<\/a><\/td>\n<\/tr>\n<tr>\n  <td><code>kanay<\/code><\/td>\n  <td>Quemar.<\/td>\n  <td><a href=\"#fuente-02\">C02, p. 18<\/a><\/td>\n<\/tr>\n<tr>\n  <td><code>maskhay<\/code><\/td>\n  <td>Buscar, examinar.<\/td>\n  <td><a href=\"#fuente-02\">C02, p. 19<\/a><\/td>\n<\/tr>\n<tr>\n  <td><code>nak'ay<\/code><\/td>\n  <td>Degollar.<\/td>\n  <td><a href=\"#fuente-02\">C02, p. 20<\/a><\/td>\n<\/tr>\n<tr>\n  <td><code>ñakay<\/code><\/td>\n  <td>Maldecir.<\/td>\n  <td><a href=\"#fuente-02\">C02, p. 21<\/a><\/td>\n<\/tr>\n<tr>\n  <td><code>ñuñuy<\/code><\/td>\n  <td>Mamar.<\/td>\n  <td><a href=\"#fuente-02\">C02, p. 22<\/a><\/td>\n<\/tr>\n<tr>\n  <td><code>pakay<\/code><\/td>\n  <td>Esconder.<\/td>\n  <td><a href=\"#fuente-02\">C02, p. 23<\/a><\/td>\n<\/tr>\n<tr>\n  <td><code>pallay<\/code><\/td>\n  <td>Recoger.<\/td>\n  <td><a href=\"#fuente-02\">C02, p. 24<\/a><\/td>\n<\/tr>\n<tr>\n  <td><code>qachay<\/code><\/td>\n  <td>Secar; glosa del material.<\/td>\n  <td><a href=\"#fuente-02\">C02, p. 25<\/a><\/td>\n<\/tr>\n<tr>\n  <td><code>qallariy<\/code><\/td>\n  <td>Empezar.<\/td>\n  <td><a href=\"#fuente-02\">C02, p. 26<\/a><\/td>\n<\/tr>\n<tr>\n  <td><code>qarpay<\/code><\/td>\n  <td>Regar.<\/td>\n  <td><a href=\"#fuente-02\">C02, p. 27<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><a id=\"sustantivo\"><\/a><\/p>\n<h2>4. El sustantivo: número, género y clasificación<\/h2>\n<h3>4.1. Qué es un sustantivo: <strong>suti<\/strong><\/h3>\n<p>El sustantivo nombra personas, animales, cosas y entidades reales o ideales. La lección distingue <code>runakuna<\/code>, <code>uywakuna<\/code> e <code>imaymanakuna<\/code>. <a href=\"#fuente-03\">C03, p. 4<\/a>.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Grupo<\/th>\n  <th>Ejemplos<\/th>\n  <th>Español del PDF<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Personas<\/td>\n  <td><code>Pablocha<\/code>, <code>Josecha<\/code>, <code>Juancha<\/code><\/td>\n  <td>Pablito, Josecito, Juancito.<\/td>\n<\/tr>\n<tr>\n  <td>Animales<\/td>\n  <td><code>alqo<\/code>, <code>khuchi<\/code>, <code>michi<\/code><\/td>\n  <td>Perro, porcino, gato.<\/td>\n<\/tr>\n<tr>\n  <td>Cosas<\/td>\n  <td><code>tiyana<\/code>, <code>punku<\/code>, <code>rumi<\/code><\/td>\n  <td>Asiento o banca, puerta, piedra.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Los nombres personales con <code>-cha<\/code> reaparecen al estudiar el diminutivo; la terminación no altera la función de sustantivo del ejemplo.<\/p>\n<h3>4.2. Singular y plural: <strong>-kuna<\/strong><\/h3>\n<p>La tabla contrapone <strong>ch'ulla<\/strong>, singular, y <strong>askha<\/strong>, plural. El procedimiento mostrado es <strong>sustantivo + -kuna<\/strong>. <a href=\"#fuente-03\">C03, p. 6<\/a>.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Singular<\/th>\n  <th>Plural<\/th>\n  <th>Equivalencia de la guía<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>tiyana<\/code><\/td>\n  <td><code>tiyanakuna<\/code><\/td>\n  <td>Asiento / asientos.<\/td>\n<\/tr>\n<tr>\n  <td><code>ayllu<\/code><\/td>\n  <td><code>ayllukuna<\/code><\/td>\n  <td>Familia / familias.<\/td>\n<\/tr>\n<tr>\n  <td><code>rumi<\/code><\/td>\n  <td><code>rumikuna<\/code><\/td>\n  <td>Piedra / piedras.<\/td>\n<\/tr>\n<tr>\n  <td><code>michi<\/code><\/td>\n  <td><code>michikuna<\/code><\/td>\n  <td>Gato / gatos.<\/td>\n<\/tr>\n<tr>\n  <td><code>runa<\/code><\/td>\n  <td><code>runakuna<\/code><\/td>\n  <td>Persona / personas.<\/td>\n<\/tr>\n<tr>\n  <td><code>p'acha<\/code><\/td>\n  <td><code>p'achakuna<\/code><\/td>\n  <td>Ropa / prendas de vestir.<\/td>\n<\/tr>\n<tr>\n  <td><code>pichana<\/code><\/td>\n  <td><code>pichanakuna<\/code><\/td>\n  <td>Objeto para barrer / objetos para barrer.<\/td>\n<\/tr>\n<tr>\n  <td><code>punku<\/code><\/td>\n  <td><code>punkukuna<\/code><\/td>\n  <td>Puerta / puertas.<\/td>\n<\/tr>\n<tr>\n  <td><code>manka<\/code><\/td>\n  <td><code>mankakuna<\/code><\/td>\n  <td>Olla / ollas.<\/td>\n<\/tr>\n<tr>\n  <td><code>wishlla<\/code><\/td>\n  <td><code>wishllakuna<\/code><\/td>\n  <td>Cucharón / cucharones; grafía de esta tabla.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>La forma <code>wishlla<\/code> se conserva como aparece aquí. Las traducciones que no se dan en esta página sirven como glosas de estudio, no como nuevas entradas léxicas confirmadas por esa tabla.<\/p>\n<p>Un contraste útil aparece en <strong>Wallpa, iskay runtuta churarusqa<\/strong>, «La gallina ha puesto dos huevos». Aunque la traducción española es plural, el ejemplo contiene <code>iskay runtu-ta<\/code>, sin <code>-kuna<\/code>. Conviene observar la forma efectivamente usada con el numeral, en lugar de añadir plural automáticamente a cada traducción española. <a href=\"#fuente-03\">C03, p. 13<\/a>.<\/p>\n<h3>4.3. Distinción de varón/mujer y macho/hembra<\/h3>\n<p>La sección titulada «género del sustantivo» presenta distinciones de vocabulario y palabras especificadoras. No muestra una regla equivalente a cambiar <code>-o<\/code> por <code>-a<\/code> en español. <a href=\"#fuente-03\">C03, p. 7<\/a>.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Ámbito<\/th>\n  <th>Distinción del curso<\/th>\n  <th>Ejemplos y traducción del PDF<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Personas<\/td>\n  <td><code>qhari<\/code> - varón<\/td>\n  <td><code>churi<\/code>, hijo; <code>qatay<\/code>, yerno; <code>qosa<\/code>, esposo.<\/td>\n<\/tr>\n<tr>\n  <td>Personas<\/td>\n  <td><code>warmi<\/code> - mujer<\/td>\n  <td><code>ususi<\/code>, hija; <code>ipa<\/code>, tía; <code>qhachun<\/code>, nuera.<\/td>\n<\/tr>\n<tr>\n  <td>Animales<\/td>\n  <td><code>orqo<\/code> - macho<\/td>\n  <td><code>k'anka<\/code>, gallo; <code>alqo<\/code>, perro; <code>asno<\/code>, burro.<\/td>\n<\/tr>\n<tr>\n  <td>Animales<\/td>\n  <td><code>china<\/code> - hembra<\/td>\n  <td><code>china waka<\/code>, vaca; <code>china alqo<\/code>, perra; <code>china michi<\/code>, gata.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>En los últimos ejemplos <strong>china<\/strong> se coloca antes del nombre del animal. Se registra la clasificación de la clase sin convertir todos los nombres de animales en sustantivos exclusivamente masculinos o femeninos.<\/p>\n<h3>4.4. Clasificación por significado<\/h3>\n<p>La clasificación semántica pregunta <strong>qué tipo de entidad nombra la palabra<\/strong>. Los ejemplos quechuas de esta tabla se conservan sin asignar una traducción nueva a cada término no glosado. <a href=\"#fuente-03\">C03, pp. 8-10<\/a>.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Clase<\/th>\n  <th>Término del curso<\/th>\n  <th>Explicación en español<\/th>\n  <th>Ejemplos del PDF<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Propio<\/td>\n  <td><code>chanin suti<\/code><\/td>\n  <td>Identifica un ser o lugar por su nombre particular.<\/td>\n  <td><code>Qosqo<\/code>, <code>Mama Oqllo<\/code>, <code>Juan<\/code>, <code>José<\/code>, <code>P'isaq<\/code>.<\/td>\n<\/tr>\n<tr>\n  <td>Común<\/td>\n  <td><code>mana chanin suti<\/code><\/td>\n  <td>Nombra una clase de seres o cosas.<\/td>\n  <td><code>atoq<\/code>, <code>wallpa<\/code>, <code>amaru<\/code>, <code>p'uku<\/code>, <code>warmi<\/code>, <code>qhari<\/code>.<\/td>\n<\/tr>\n<tr>\n  <td>Concreto<\/td>\n  <td><code>rikuy hap'iy atina suti<\/code><\/td>\n  <td>En la explicación del curso, se puede ver o tocar.<\/td>\n  <td><code>inti<\/code>, <code>perqa<\/code>, <code>rumi<\/code>, <code>tiyana<\/code>, <code>hanp'ara<\/code>.<\/td>\n<\/tr>\n<tr>\n  <td>Abstracto<\/td>\n  <td><code>haqechasqa suti<\/code><\/td>\n  <td>En la explicación del curso, no se puede ver ni tocar.<\/td>\n  <td><code>iñi<\/code>, <code>apuyaya<\/code>, <code>nuna<\/code>, <code>killki<\/code>, <code>kusi<\/code>.<\/td>\n<\/tr>\n<tr>\n  <td>Colectivo<\/td>\n  <td><code>askha askhamanta sutichaq<\/code><\/td>\n  <td>Nombra un conjunto.<\/td>\n  <td><code>ayllu<\/code>, <code>ranra<\/code>, <code>walla-walla<\/code>, <code>sach'a sach'a<\/code>.<\/td>\n<\/tr>\n<tr>\n  <td>No contable<\/td>\n  <td><code>mana yupay atina sutikuna<\/code><\/td>\n  <td>Se presenta como materia o cantidad, no como unidades individualizadas.<\/td>\n  <td><code>kachi<\/code>, <code>aqo<\/code>, <code>misk'i<\/code>.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Ejemplos completos del repaso:<\/strong><\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Quechua de la lección<\/th>\n  <th>Español<\/th>\n  <th>Qué permite reconocer<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>Juan, warminwan maqanakushan.<\/code><\/td>\n  <td>Juan se está peleando con su mujer. <strong>PDF<\/strong><\/td>\n  <td><code>Juan<\/code> es nombre propio.<\/td>\n<\/tr>\n<tr>\n  <td><code>Wallpa, iskay runtuta churarusqa.<\/code><\/td>\n  <td>La gallina ha puesto dos huevos. <strong>PDF<\/strong><\/td>\n  <td><code>wallpa<\/code> es nombre común.<\/td>\n<\/tr>\n<tr>\n  <td><code>Noqaq aylluyqa, pisillan.<\/code><\/td>\n  <td>Mi familia es pequeña o poco numerosa. <strong>Guía<\/strong>; el PDF dice «Mi familia es poco».<\/td>\n  <td><code>ayllu<\/code> nombra un conjunto.<\/td>\n<\/tr>\n<tr>\n  <td><code>Ñut'u aqota, panpaman hich'ay.<\/code><\/td>\n  <td>Echa la arena fina al suelo. <strong>PDF<\/strong><\/td>\n  <td><code>aqo<\/code> se usa como nombre de materia.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Fuente de los cuatro ejemplos: <a href=\"#fuente-03\">C03, p. 13<\/a>. La lista de abstractos se conserva como clasificación del material; no se deducen de ella definiciones léxicas no explicadas en clase.<\/p>\n<h3>4.5. Clasificación por formación<\/h3>\n<p>Esta clasificación pregunta <strong>cómo está construida la palabra o expresión<\/strong>. Es un criterio diferente del significado: una expresión puede ser colectiva por su sentido y compuesta por su formación. <a href=\"#fuente-03\">C03, pp. 11-12<\/a>.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Clase<\/th>\n  <th>Nombre del curso<\/th>\n  <th>Ejemplos<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Simple<\/td>\n  <td><code>saphi sutikuna<\/code><\/td>\n  <td><code>sach'a<\/code>, <code>yawar<\/code>, <code>alqo<\/code>, <code>ñawi<\/code>, <code>kiru<\/code>.<\/td>\n<\/tr>\n<tr>\n  <td>Compuesto<\/td>\n  <td><code>askha askha suti<\/code><\/td>\n  <td><code>arwi arwi<\/code>, <code>ranra-ranra<\/code>, <code>sach'a-sach'a<\/code>, <code>yachay wasi<\/code>.<\/td>\n<\/tr>\n<tr>\n  <td>Derivado<\/td>\n  <td><code>hoq rimaykunamanta hamuq sutikuna<\/code><\/td>\n  <td>Formas reunidas en los tres grupos de la página siguiente.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>La lección incluye repeticiones y combinaciones de palabras entre los compuestos. Su ejemplo de repetición es:<\/p>\n<blockquote>\n<p><strong>Sach'a sach'apin puñurapusqani.<\/strong><br />\n<strong>PDF:<\/strong> Dentro de los arbustos me había quedado dormido.<br />\n<a href=\"#fuente-03\">C03, p. 11<\/a>.<\/p>\n<\/blockquote>\n<h3>4.6. Sustantivos derivados y nombres de quien realiza una acción<\/h3>\n<p>La clase presenta estos tres grupos. El primero se transcribe con el rótulo del material; su clasificación requiere cautela porque no se explica la derivación de cada base. <a href=\"#fuente-03\">C03, p. 12<\/a>.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Grupo de la diapositiva<\/th>\n  <th>Formas de la lección<\/th>\n  <th>Traducción o comentario<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>sutimanta hamuq<\/code>: «sustantivo nominal»<\/td>\n  <td><code>auqanakuq<\/code>, <code>takipakuq<\/code>, <code>atipakuq<\/code><\/td>\n  <td><strong>PDF:<\/strong> guerrero; cantor en compañía de alguien; vencedor. No se propone aquí una regla general a partir del rótulo.<\/td>\n<\/tr>\n<tr>\n  <td>Derivado de un adjetivo<\/td>\n  <td><code>pukakaq<\/code>, <code>yanakaq<\/code>, <code>sipaskaq<\/code>, <code>ñausakaq<\/code>, <code>chaupikaq<\/code><\/td>\n  <td>El ejemplo traducido ilustra <code>yanakaq<\/code>; la lista no glosa individualmente las demás formas.<\/td>\n<\/tr>\n<tr>\n  <td>Derivado de un verbo<\/td>\n  <td><code>taki-q<\/code>, <code>puri-q<\/code>, <code>llank'a-q<\/code>, <code>tiya-pakuq<\/code><\/td>\n  <td><strong>PDF:<\/strong> cantante, caminante, trabajador, el que vive en casa de alguien.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>En la serie más transparente se reconoce <strong>base verbal + -q<\/strong>: <code>taki-q<\/code>, <code>puri-q<\/code>, <code>llank'a-q<\/code>. El resultado designa a quien realiza la actividad. No se debe reducir <code>tiya-pakuq<\/code> al mismo análisis sin reconocer que contiene material adicional.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Ejemplo de la lección<\/th>\n  <th>Español del PDF<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>Isabel Takipayukushan Luiswan.<\/code><\/td>\n  <td>Isabel está cantando en compañía de Luis.<\/td>\n<\/tr>\n<tr>\n  <td><code>Yanakaq thantata apamuy.<\/code><\/td>\n  <td>Trae el trapo negro.<\/td>\n<\/tr>\n<tr>\n  <td><code>Puriq, qonqanpusqa chukunta.<\/code><\/td>\n  <td>El caminante se había olvidado su sombrero.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Fuente: <a href=\"#fuente-03\">C03, p. 12<\/a>. El PDF escribe <code>takipakuq<\/code> en la lista y <code>Takipayukushan<\/code> en el ejemplo: se conservan ambas formas sin convertir una en paradigma de la otra.<\/p>\n<p><a id=\"posesion\"><\/a><\/p>\n<h2>5. La posesión: mi casa, tu casa, nuestras casas<\/h2>\n<h3>5.1. El poseedor se marca en el sustantivo<\/h3>\n<p>La clase denomina estas construcciones <strong>kaqniyuq suti chaninchaqkuna<\/strong>, «adjetivos posesivos». En el modelo <strong>wasi<\/strong>, casa, la terminación del nombre indica a quién pertenece. Las expresiones y traducciones de la tabla proceden de <a href=\"#fuente-06\">C06, p. 14<\/a>.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Poseedor de la tabla<\/th>\n  <th>Terminación<\/th>\n  <th>Forma con <code>wasi<\/code><\/th>\n  <th>Español<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>noqa-q<\/code><\/td>\n  <td><code>-y<\/code><\/td>\n  <td><code>wasi-y<\/code><\/td>\n  <td>Mi casa.<\/td>\n<\/tr>\n<tr>\n  <td><code>qan-pa<\/code><\/td>\n  <td><code>-yki<\/code><\/td>\n  <td><code>wasi-yki<\/code><\/td>\n  <td>Tu casa.<\/td>\n<\/tr>\n<tr>\n  <td><code>pay-pa<\/code><\/td>\n  <td><code>-n<\/code><\/td>\n  <td><code>wasi-n<\/code><\/td>\n  <td>Su casa, de él o ella.<\/td>\n<\/tr>\n<tr>\n  <td><code>noqanchis-pa<\/code><\/td>\n  <td><code>-nchis<\/code><\/td>\n  <td><code>wasi-nchis<\/code><\/td>\n  <td>Nuestra casa; incluyente.<\/td>\n<\/tr>\n<tr>\n  <td><code>noqayku-q<\/code><\/td>\n  <td><code>-yku<\/code><\/td>\n  <td><code>wasi-yku<\/code><\/td>\n  <td>Nuestra casa; excluyente.<\/td>\n<\/tr>\n<tr>\n  <td><code>qankuna-q<\/code><\/td>\n  <td><code>-ykichis<\/code><\/td>\n  <td><code>wasi-ykichis<\/code><\/td>\n  <td>Su casa, de ustedes; el PDF dice «vuestra casa».<\/td>\n<\/tr>\n<tr>\n  <td><code>paykuna-q<\/code><\/td>\n  <td><code>-nku<\/code><\/td>\n  <td><code>wasi-nku<\/code><\/td>\n  <td>La casa de ellos o ellas.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Las etiquetas incluyente/excluyente son aclaraciones de la guía para distinguir las dos filas de «nuestra casa». En el poseedor, las formas con <code>-q<\/code> y <code>-pa<\/code> expresan la relación «de». La tabla las proporciona ya formadas; no explica un paradigma completo de sus variantes.<\/p>\n<p><strong>Esquema para leer el modelo:<\/strong> poseedor + nombre con marca posesiva. Así, la correspondencia entre <code>noqa-q<\/code> y <code>wasi-y<\/code> permite entender «mi casa». Los guiones de la tabla son de estudio, no espacios que deban insertarse al escribir.<\/p>\n<h3>5.2. Poseedor y plural de lo poseído<\/h3>\n<blockquote>\n<p><strong>WASIYKUNA = Mis casas.<\/strong><br />\n<a href=\"#fuente-06\">C06, p. 14<\/a>.<\/p>\n<\/blockquote>\n<p>La segmentación <strong>wasi-y-kuna<\/strong> distingue dos informaciones: <code>-y<\/code> indica «mi» y <code>-kuna<\/code> indica que las casas son varias. Que haya un poseedor plural tampoco significa por sí solo que lo poseído sea plural: <code>wasinku<\/code> se traduce en la tabla como «la casa de ellos».<\/p>\n<h3>5.3. Posesión más otro sufijo<\/h3>\n<p>Los ejemplos de la clase 4 muestran que a una forma poseída se le puede añadir una relación como lugar, compañía o destinatario:<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Forma del ejemplo<\/th>\n  <th>Segmentación de la guía<\/th>\n  <th>Lectura<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>wasiypi<\/code><\/td>\n  <td><code>wasi-y-pi<\/code><\/td>\n  <td>En mi casa.<\/td>\n<\/tr>\n<tr>\n  <td><code>mamaywan<\/code><\/td>\n  <td><code>mama-y-wan<\/code><\/td>\n  <td>Con mi mamá.<\/td>\n<\/tr>\n<tr>\n  <td><code>warmiypaq<\/code><\/td>\n  <td><code>warmi-y-paq<\/code><\/td>\n  <td>Para mi mujer o esposa.<\/td>\n<\/tr>\n<tr>\n  <td><code>churiypaq<\/code><\/td>\n  <td><code>churi-y-paq<\/code><\/td>\n  <td>Para mi hijo.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Las lecturas se apoyan en las traducciones de las oraciones completas. <a href=\"#fuente-04\">C04, pp. 4, 12<\/a>. El patrón observado es <strong>nombre + posesión + relación<\/strong>; no es una lista de todas las combinaciones posibles.<\/p>\n<p><a id=\"sufijos-caso\"><\/a><\/p>\n<h2>6. Sufijos de relación, lugar, dirección y finalidad<\/h2>\n<p>La lección los llama <strong>seq'e yapaykuna<\/strong>, sufijos. En español muchas de estas relaciones se expresan con palabras anteriores al nombre: «en», «con», «desde», «para». En los ejemplos quechuas la marca se añade a la palabra. <a href=\"#fuente-04\">C04, pp. 3-14<\/a>.<\/p>\n<h3>6.1. Cuadro general<\/h3>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Forma trabajada<\/th>\n  <th>Función para leer los ejemplos<\/th>\n  <th>Ejemplo de clase<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>-pi<\/code><\/td>\n  <td>Lugar: en.<\/td>\n  <td><code>llaqtapi<\/code>, <code>kaypi<\/code>.<\/td>\n<\/tr>\n<tr>\n  <td><code>-wan<\/code><\/td>\n  <td>Compañía: con.<\/td>\n  <td><code>wayqeywan<\/code>, <code>paywan<\/code>.<\/td>\n<\/tr>\n<tr>\n  <td><code>-manta<\/code><\/td>\n  <td>Procedencia: de, desde.<\/td>\n  <td><code>Qosqomanta<\/code>.<\/td>\n<\/tr>\n<tr>\n  <td><code>-kama<\/code><\/td>\n  <td>Límite: hasta.<\/td>\n  <td><code>watakama<\/code>.<\/td>\n<\/tr>\n<tr>\n  <td><code>-man<\/code><\/td>\n  <td>Dirección o destino: a, hacia.<\/td>\n  <td><code>chakraman<\/code>.<\/td>\n<\/tr>\n<tr>\n  <td><code>-ta<\/code><\/td>\n  <td>Marca de objeto en los ejemplos centrales; también aparece con destino.<\/td>\n  <td><code>ñanta<\/code>, <code>payta<\/code>, <code>Acosta<\/code>.<\/td>\n<\/tr>\n<tr>\n  <td><code>-rayku<\/code><\/td>\n  <td>Causa o motivo: por.<\/td>\n  <td><code>qolqerayku<\/code>.<\/td>\n<\/tr>\n<tr>\n  <td><code>-nta / -ninta<\/code><\/td>\n  <td>Trayecto o lugar por donde se pasa, según la lección.<\/td>\n  <td><code>k'ijllunta<\/code>, <code>San Blasninta<\/code>.<\/td>\n<\/tr>\n<tr>\n  <td><code>-paq<\/code><\/td>\n  <td>Finalidad o beneficiario: para.<\/td>\n  <td><code>warmiypaq<\/code>.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><code>-wan<\/code> «con» debe distinguirse de las formas verbales traducidas como «me» o «nos» en la misma clase; se explican por separado abajo.<\/p>\n<h3>6.2. <strong>-pi<\/strong>: en un lugar<\/h3>\n<p>La definición del PDF incluye localización espacial o temporal. Sus ejemplos desarrollados son espaciales. También muestra <strong>kaypi<\/strong>, aquí, y <strong>chaypi<\/strong>, ahí. <a href=\"#fuente-04\">C04, p. 4<\/a>.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Quechua<\/th>\n  <th>Español del PDF<\/th>\n  <th>Foco de lectura<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>Wayqey kay llaqtapi mamaywan tiyan.<\/code><\/td>\n  <td>Mi hermano vive en este pueblo con mi mamá.<\/td>\n  <td><code>llaqta-pi<\/code>: en el pueblo.<\/td>\n<\/tr>\n<tr>\n  <td><code>Kaypi taytaywan tiyani.<\/code><\/td>\n  <td>Aquí vivo con mi padre.<\/td>\n  <td><code>kay-pi<\/code>: aquí.<\/td>\n<\/tr>\n<tr>\n  <td><code>Chaypi taytayki wañuran.<\/code><\/td>\n  <td>Ahí murió tu padre.<\/td>\n  <td><code>chay-pi<\/code>: ahí.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>El segundo ejemplo combina <code>-pi<\/code> con <code>-wan<\/code>: responde a <strong>dónde<\/strong> y <strong>con quién<\/strong>.<\/p>\n<h3>6.3. <strong>-wan<\/strong>: con alguien<\/h3>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Quechua<\/th>\n  <th>Español del PDF<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>Noqa wayqeywan maqanayukuni.<\/code><\/td>\n  <td>Yo con mi hermano he peleado.<\/td>\n<\/tr>\n<tr>\n  <td><code>Paywan rimayta munani.<\/code><\/td>\n  <td>Quiero hablar con él o ella.<\/td>\n<\/tr>\n<tr>\n  <td><code>Noqa wayqeywan llank'ani.<\/code><\/td>\n  <td>Yo trabajo con mi hermano.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>En <code>wayqe-y-wan<\/code>, primero se expresa «mi hermano» y después «con». En <code>pay-wan<\/code>, el sufijo se añade al pronombre. <a href=\"#fuente-04\">C04, pp. 5, 14<\/a>.<\/p>\n<h3>6.4. Dentro del verbo: «me» y «nos»<\/h3>\n<p>La diapositiva vuelve a rotular <strong>WAN = me<\/strong>, pero sus formas verbales deben leerse como una estructura diferente de <code>pay-wan<\/code> «con él». <a href=\"#fuente-04\">C04, p. 5<\/a>.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Quechua<\/th>\n  <th>Español del PDF<\/th>\n  <th>Lectura de la guía<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>Kay wayna Runa simita yachachiwan.<\/code><\/td>\n  <td>Este muchacho me enseña quechua.<\/td>\n  <td><code>yachachi-wa-n<\/code>: base verbal + objeto de primera persona + terminación verbal.<\/td>\n<\/tr>\n<tr>\n  <td><code>Hoq warmikuna maskawanchis.<\/code><\/td>\n  <td>Unas mujeres nos buscan.<\/td>\n  <td>La forma verbal expresa una acción dirigida hacia «nosotros»; no significa «buscan con».<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Aclaración editorial:<\/strong> <code>-wan<\/code> nominal «con» y <code>-wa-<\/code> verbal «me/nos» son distintos. En <code>yachachi-wa-n<\/code>, el <code>-n<\/code> final pertenece a la conjugación. La separación de objeto y persona verbal puede contrastarse con las tablas del <a href=\"https://ohiostate.pressbooks.pub/quechua/chapter/chapter-9/\" target=\"_blank\" rel=\"noopener noreferrer\">capítulo 9 del curso de quechua alojado en Ohio State<\/a>. No se desarrolla aquí el paradigma completo de transiciones.<\/p>\n<h3>6.5. <strong>-manta<\/strong>: de, desde<\/h3>\n<p>Marca la procedencia en los ejemplos trabajados. <a href=\"#fuente-04\">C04, p. 6<\/a>.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Quechua<\/th>\n  <th>Español del PDF<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>Noqa Qosqomanta hamuni.<\/code><\/td>\n  <td>Yo vengo del Cusco.<\/td>\n<\/tr>\n<tr>\n  <td><code>Pay Limamanta chayamusqa.<\/code><\/td>\n  <td>Él llegó de Lima.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>La equivalencia «de» corresponde aquí al <strong>origen<\/strong>, no a la posesión de la sección 5.<\/p>\n<h3>6.6. <strong>-kama<\/strong>: hasta<\/h3>\n<p>El PDF habla de límite de tiempo, lugar y acrecentamiento; los dos ejemplos traducidos son despedidas que establecen un límite temporal. <a href=\"#fuente-04\">C04, p. 7<\/a>.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Quechua<\/th>\n  <th>Español del PDF<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>Hoq p'unchaukama<\/code><\/td>\n  <td>Hasta otro día.<\/td>\n<\/tr>\n<tr>\n  <td><code>Hoq watakama<\/code><\/td>\n  <td>Hasta el próximo año.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Se conserva la grafía <code>p'unchau<\/code> de esta clase. El PDF no aporta aquí una serie de ejemplos para cada uno de los otros usos mencionados.<\/p>\n<h3>6.7. <strong>-man<\/strong>: a, hacia<\/h3>\n<p>Indica dirección hacia un destino. <a href=\"#fuente-04\">C04, p. 8<\/a>.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Quechua<\/th>\n  <th>Español del PDF<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>wasiman<\/code><\/td>\n  <td>A la casa.<\/td>\n<\/tr>\n<tr>\n  <td><code>orqoman<\/code><\/td>\n  <td>Al cerro.<\/td>\n<\/tr>\n<tr>\n  <td><code>chakraman<\/code><\/td>\n  <td>A la chacra.<\/td>\n<\/tr>\n<tr>\n  <td><code>wayq'oman<\/code><\/td>\n  <td>A la quebrada.<\/td>\n<\/tr>\n<tr>\n  <td><code>kinrayman<\/code><\/td>\n  <td>A la quebrada; glosa que requiere revisión.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Para la función de dirección, los cuatro primeros ejemplos son claros. La equivalencia particular de <code>kinray<\/code> no se deduce del sufijo; véase <a href=\"#revision-r06\">R06<\/a>.<\/p>\n<h3>6.8. <strong>-ta<\/strong>: reconocer el objeto<\/h3>\n<p>La diapositiva enumera «a, hacia, al, a la, a los» y menciona el acusativo. Para estudiar los ejemplos conviene identificar primero <strong>qué se conoce, a quién se busca o a quién se quiere<\/strong>. <a href=\"#fuente-04\">C04, pp. 9, 14<\/a>.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Quechua<\/th>\n  <th>Español del PDF<\/th>\n  <th>Elemento marcado<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>Noqa Inka ñanta rikuni.<\/code><\/td>\n  <td>Yo conozco el camino del Inka.<\/td>\n  <td><code>ñan-ta<\/code>, el camino.<\/td>\n<\/tr>\n<tr>\n  <td><code>Taytay payta maskhan.<\/code><\/td>\n  <td>Mi padre lo busca a él.<\/td>\n  <td><code>pay-ta<\/code>, a él.<\/td>\n<\/tr>\n<tr>\n  <td><code>Taytay payta munan.<\/code><\/td>\n  <td>Mi padre lo quiere a él o ella.<\/td>\n  <td><code>pay-ta<\/code>, a él o ella.<\/td>\n<\/tr>\n<tr>\n  <td><code>Mamay Acosta ch'usan.<\/code><\/td>\n  <td>Mi madre viaja a Acos.<\/td>\n  <td><code>Acos-ta<\/code>, destino en este ejemplo.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Aclaración editorial:<\/strong> <code>-ta<\/code> marca el objeto directo, no un artículo. Véase el apartado sobre el acusativo del <a href=\"https://formacionenservicio.minedu.gob.pe/sifods/centro-recurso/2022/Material-educativo/Libro/manual-escritura-quechua-sureno.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">manual del Minedu<\/a>. La oración con <strong>Acos<\/strong> conserva el uso de destino de la lección.<\/p>\n<h3>6.9. <strong>-rayku<\/strong>: por una causa o motivo<\/h3>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Quechua<\/th>\n  <th>Español del PDF<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>imarayku<\/code><\/td>\n  <td>¿Por qué?<\/td>\n<\/tr>\n<tr>\n  <td><code>qolqerayku<\/code><\/td>\n  <td>Por dinero.<\/td>\n<\/tr>\n<tr>\n  <td><code>chayrayku<\/code><\/td>\n  <td>Por eso.<\/td>\n<\/tr>\n<tr>\n  <td><code>wawarayku<\/code><\/td>\n  <td>Por el hijo.<\/td>\n<\/tr>\n<tr>\n  <td><code>qanrayku<\/code><\/td>\n  <td>Por ti.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>La pregunta <code>ima-rayku<\/code> busca el motivo. No debe confundirse este «por» causal con «por una calle», que expresa trayecto. <a href=\"#fuente-04\">C04, p. 10<\/a>.<\/p>\n<h3>6.10. <strong>-nta / -ninta<\/strong>: por dónde se transita<\/h3>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Quechua<\/th>\n  <th>Español del PDF<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>Chaparro k'ijllunta hamunki.<\/code><\/td>\n  <td>Vienes por la calle Chaparro.<\/td>\n<\/tr>\n<tr>\n  <td><code>Kunan tususpa hamunkichis, San Blasninta.<\/code><\/td>\n  <td>Hoy vendrán bailando por San Blas. La p. 14 dice «Hoy vienen bailando por San Blas».<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>La clase destaca el <strong>recorrido<\/strong>, no el motivo. Se conservan las dos traducciones temporales del segundo ejemplo porque la forma de segunda persona coincide en presente y futuro en el paradigma del curso. <a href=\"#fuente-04\">C04, pp. 11, 14<\/a>; <a href=\"#fuente-02\">C02, p. 30<\/a>.<\/p>\n<p>Se sigue el encabezado <code>NTA/NINTA<\/code> de la p. 11. El repaso de la p. 13 imprime <code>nta/inta<\/code>; no se introduce <code>-inta<\/code> como una tercera forma confirmada.<\/p>\n<h3>6.11. <strong>-paq<\/strong>: para alguien<\/h3>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Quechua<\/th>\n  <th>Español del PDF<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>Noqa warmiypaq huj sumaq wasita rantisaq.<\/code><\/td>\n  <td>Yo voy a comprar una casa para mi mujer.<\/td>\n<\/tr>\n<tr>\n  <td><code>Churiypaq warata rantipusaq.<\/code><\/td>\n  <td>Voy a comprar un pantalón para mi hijo.<\/td>\n<\/tr>\n<tr>\n  <td><code>Noqa warmiypaq munay wasita rantisaq.<\/code><\/td>\n  <td>Yo voy a comprar una hermosa casa para mi mujer.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Las dos primeras oraciones están en la p. 12; la tercera, en el repaso de la p. 14. <code>warmi-y-paq<\/code> y <code>churi-y-paq<\/code> identifican al beneficiario. La primera traducción impresa omite la cualidad <code>sumaq<\/code>; no se usa esa omisión como prueba de que la palabra carezca de significado. <a href=\"#fuente-04\">C04, pp. 12, 14<\/a>.<\/p>\n<p><a id=\"matices\"><\/a><\/p>\n<h2>7. Énfasis, preguntas, negación y otros matices<\/h2>\n<p>La clase 5 reúne estas formas bajo <strong>yapakuq seq'ekuna<\/strong>, morfemas que enriquecen el sentido dentro de la oración. Algunas afectan a una palabra destacada; otras expresan interrogación, negación, restricción o actitud del hablante. No todas tienen una traducción española independiente. <a href=\"#fuente-05\">C05, pp. 3-13<\/a>.<\/p>\n<h3>7.1. <strong>-n / -mi<\/strong>: la afirmación y la palabra destacada<\/h3>\n<p>El curso presenta <code>-n<\/code> después de vocal y <code>-mi<\/code> después de consonante, como enfatizadores. <a href=\"#fuente-05\">C05, pp. 3, 6<\/a>.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Forma de clase<\/th>\n  <th>Español<\/th>\n  <th>Lectura<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>Maria-n<\/code><\/td>\n  <td>Es María. <strong>PDF<\/strong><\/td>\n  <td>Se afirma o identifica a María.<\/td>\n<\/tr>\n<tr>\n  <td><code>yachachiq-mi<\/code><\/td>\n  <td>Es profesor o profesora. <strong>PDF<\/strong><\/td>\n  <td>Se afirma la condición de profesor.<\/td>\n<\/tr>\n<tr>\n  <td><code>takiq-mi<\/code><\/td>\n  <td>Es cantante. <strong>PDF<\/strong><\/td>\n  <td>Se afirma la condición de cantante.<\/td>\n<\/tr>\n<tr>\n  <td><code>Hayk'aqmi kutimunki<\/code><\/td>\n  <td>¿Cuándo volverás? <strong>Guía<\/strong><\/td>\n  <td>El morfema acompaña al interrogativo; no se traduce mecánicamente como «es».<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>La p. 7 también los describe como formas que «trabajan como verbo», con ejemplos como:<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Quechua<\/th>\n  <th>Español de la guía<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>Juanqa opan.<\/code><\/td>\n  <td>Juan es tonto.<\/td>\n<\/tr>\n<tr>\n  <td><code>Paymi umalliq.<\/code><\/td>\n  <td>Él o ella es dirigente.<\/td>\n<\/tr>\n<tr>\n  <td><code>Ñañaymi hanpikamayuq.<\/code><\/td>\n  <td>Mi hermana es médica.<\/td>\n<\/tr>\n<tr>\n  <td><code>Qosaymi allin runa.<\/code><\/td>\n  <td>Mi esposo es una buena persona.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Fuente: <a href=\"#fuente-05\">C05, p. 7<\/a>. La traducción española de estas predicaciones necesita «es», pero no convierte a <code>-n/-mi<\/code> en una conjugación universal de «ser».<\/p>\n<p><strong>Aclaración editorial:<\/strong> el manual del Minedu relaciona el atestiguativo <code>-m/-mi<\/code> con la realización <code>-n<\/code> en collao. Se conserva la grafía de clase, distinguiéndola de <code>-n<\/code> posesivo y verbal. Véase el cuadro de sufijos normalizados del <a href=\"https://formacionenservicio.minedu.gob.pe/sifods/centro-recurso/2022/Material-educativo/750.018452-Item-9-manual-de-escritura-en-lengua-quechua-sureno-Baja.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">manual<\/a>.<\/p>\n<h3>7.2. <strong>-qa<\/strong>: presentar el tema<\/h3>\n<p>El PDF lo llama «enfatizador» y señala que no tiene traducción propia. Como ayuda de lectura, puede pensarse en la palabra de la que se va a hablar: «en cuanto a...». Esa expresión es una explicación, no algo que se deba insertar siempre en la traducción. <a href=\"#fuente-05\">C05, pp. 4, 6<\/a>.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Quechua<\/th>\n  <th>Español de la guía<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>Juanqa yachachiqmi.<\/code><\/td>\n  <td>Juan es profesor.<\/td>\n<\/tr>\n<tr>\n  <td><code>Noqaqa manan hamusaqchu.<\/code><\/td>\n  <td>Yo no vendré.<\/td>\n<\/tr>\n<tr>\n  <td><code>Wawaykiqa haqaypi llank'ashan.<\/code><\/td>\n  <td>Tu hijo o hija está trabajando allá.<\/td>\n<\/tr>\n<tr>\n  <td><code>Wayqeyqa wasiyta hamunqa.<\/code><\/td>\n  <td>Mi hermano vendrá a mi casa.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>En la primera oración, <code>Juan-qa<\/code> presenta el tema y <code>yachachiq-mi<\/code> afirma lo que se dice de él. La denominación <strong>topicalizador<\/strong> para <code>-qa<\/code> se contrasta en el <a href=\"https://formacionenservicio.minedu.gob.pe/sifods/centro-recurso/2022/Material-educativo/Libro/manual-escritura-quechua-sureno.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">manual del Minedu<\/a>.<\/p>\n<h3>7.3. <strong>-puni<\/strong>, <strong>-punin<\/strong>, <strong>-puniyá<\/strong><\/h3>\n<p>La clase relaciona estas formas con especificación definitiva, afirmación, «mismo» y «siempre». Los ejemplos muestran que no conviene traducirlas todas con una única palabra. <a href=\"#fuente-05\">C05, pp. 4-6<\/a>.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Forma<\/th>\n  <th>Valor que destaca la lección<\/th>\n  <th>Ejemplo<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>-puni<\/code><\/td>\n  <td>Identificación o insistencia.<\/td>\n  <td><code>Noqapuni<\/code>: yo mismo. <strong>PDF<\/strong><\/td>\n<\/tr>\n<tr>\n  <td><code>-puni<\/code><\/td>\n  <td>Identificación o insistencia.<\/td>\n  <td><code>Michipuni<\/code>: el mismo gato. <strong>PDF<\/strong><\/td>\n<\/tr>\n<tr>\n  <td><code>-puni<\/code><\/td>\n  <td>Identificación o insistencia.<\/td>\n  <td><code>Martapuni<\/code>: Marta misma. <strong>PDF<\/strong><\/td>\n<\/tr>\n<tr>\n  <td><code>-punin<\/code><\/td>\n  <td>Énfasis, «mismo/siempre» en el rótulo.<\/td>\n  <td><code>Noqapunin wayk'usaq.<\/code> - Yo mismo cocinaré. <strong>Guía<\/strong><\/td>\n<\/tr>\n<tr>\n  <td><code>-puniyá<\/code><\/td>\n  <td>Aseverar o asegurar.<\/td>\n  <td><code>Carlapuniyá hatun yachay wasipi yachan.<\/code> - Es Carla, pues, quien estudia en la universidad. <strong>Guía<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Para estudiar la acumulación, se pueden reconocer las secuencias <strong>-puni + -n<\/strong> y <strong>-puni + -yá<\/strong>, a partir de las funciones que la misma clase explica por separado. No se convierten estas combinaciones en paradigmas nuevos.<\/p>\n<h3>7.4. <strong>-chu<\/strong>: pregunta y negación<\/h3>\n<p>La lámina de repaso ilustra tres construcciones. <a href=\"#fuente-05\">C05, p. 6<\/a>.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Construcción<\/th>\n  <th>Ejemplo<\/th>\n  <th>Español del PDF<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>Pregunta<\/td>\n  <td><code>Alqochu?<\/code><\/td>\n  <td>¿Es el perro?<\/td>\n<\/tr>\n<tr>\n  <td>Negación con <code>mana<\/code><\/td>\n  <td><code>Mana mihusaqchu.<\/code><\/td>\n  <td>No comeré.<\/td>\n<\/tr>\n<tr>\n  <td>Prohibición con <code>ama<\/code><\/td>\n  <td><code>Ama pukllaychu.<\/code><\/td>\n  <td>No juegues.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Cómo distinguirlas:<\/strong> la presencia de <code>-chu<\/code> no vuelve negativa una pregunta afirmativa. En los ejemplos negativos aparece junto con <code>mana<\/code>; en el mandato negativo, con <code>ama<\/code>. El curso también muestra <code>manan<\/code>: por ejemplo, <code>Noqaqa manan hamusaqchu<\/code>. <a href=\"#fuente-05\">C05, p. 4<\/a>.<\/p>\n<p>Se conserva <code>mihusaq<\/code> tal como aparece en el repaso. La distinción entre preguntas y negaciones se estudia por la construcción completa, no solo por la última terminación.<\/p>\n<h3>7.5. <strong>-lla<\/strong>: solo, nomás; afecto según el contexto<\/h3>\n<p>La lección lo presenta como limitativo, afectivo en preguntas y relacionado con repetición en ciertos ejemplos. <a href=\"#fuente-05\">C05, p. 8<\/a>.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Quechua<\/th>\n  <th>Español de la guía<\/th>\n  <th>Qué se observa<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>Imaynallan kashanki?<\/code><\/td>\n  <td>¿Cómo estás?<\/td>\n  <td>En la pregunta de trato, el valor no se traduce necesariamente como «solo».<\/td>\n<\/tr>\n<tr>\n  <td><code>Noqallan hamuni.<\/code><\/td>\n  <td>Solo yo vengo.<\/td>\n  <td>Restricción sobre <code>noqa<\/code>.<\/td>\n<\/tr>\n<tr>\n  <td><code>Waqaylla waqan.<\/code><\/td>\n  <td>Llora y llora; no hace más que llorar.<\/td>\n  <td>Repetición verbal más valor restrictivo.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>El PDF también incluye <code>Takiyuspallan payqa ruwan<\/code> y <code>Llakiy llakiylla purishan<\/code>, sin traducción. No se extrae de esos ejemplos un paradigma verbal completo de <code>-lla<\/code>.<\/p>\n<h3>7.6. <strong>-ña<\/strong>: ya; con negación, ya no<\/h3>\n<p>La lección lo llama «discontinuativo»: marca un cambio respecto de la situación previa. Da «ya» y, al combinarse con <code>ama/mana<\/code>, «ya no». <a href=\"#fuente-05\">C05, p. 9<\/a>.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Quechua<\/th>\n  <th>Español de la guía<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>Mariaqa wayk'uyta yachanñan.<\/code><\/td>\n  <td>María ya sabe cocinar.<\/td>\n<\/tr>\n<tr>\n  <td><code>Noqaqa ñan wawayuqña kani.<\/code><\/td>\n  <td>Yo ya tengo un hijo o una hija.<\/td>\n<\/tr>\n<tr>\n  <td><code>Amaña tapuwaychu.<\/code><\/td>\n  <td>Ya no me preguntes.<\/td>\n<\/tr>\n<tr>\n  <td><code>Noqallaña wakataqa qatisaq.<\/code><\/td>\n  <td>Ahora solo yo conduciré la vaca.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>La segunda oración conserva las dos apariciones gráficas relacionadas con <code>ña<\/code> que imprime el PDF. La última permite reconocer la combinación <code>noqa-lla-ña<\/code>; su traducción es contextual, no una regla palabra por palabra.<\/p>\n<h3>7.7. <strong>-yá<\/strong>: pues, énfasis y emoción<\/h3>\n<p>La explicación de clase habla de ánimo y emoción; propone la equivalencia «pues». <a href=\"#fuente-05\">C05, pp. 6, 10<\/a>.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Quechua<\/th>\n  <th>Español<\/th>\n  <th>Origen<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>Manayá munanichu.<\/code><\/td>\n  <td>No quiero, pues.<\/td>\n  <td>PDF, p. 6.<\/td>\n<\/tr>\n<tr>\n  <td><code>Manayá hinachu.<\/code><\/td>\n  <td>Así no es, pues.<\/td>\n  <td>PDF, p. 6.<\/td>\n<\/tr>\n<tr>\n  <td><code>Amayá chayta ruwaychu.<\/code><\/td>\n  <td>No hagas eso, pues.<\/td>\n  <td>Guía, p. 10.<\/td>\n<\/tr>\n<tr>\n  <td><code>Amayá wakata paskaychu.<\/code><\/td>\n  <td>No sueltes la vaca, pues.<\/td>\n  <td>Guía, p. 10.<\/td>\n<\/tr>\n<tr>\n  <td><code>Paqarinñayá mikhusunchis.<\/code><\/td>\n  <td>Mañana ya comeremos, pues.<\/td>\n  <td>Guía, p. 10.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>En el último ejemplo se observa <code>-ña + -yá<\/code>. Las partículas españolas elegidas expresan el matiz y pueden variar con el contexto.<\/p>\n<h3>7.8. <strong>-má<\/strong>: sorpresa en la explicación de la lección<\/h3>\n<p>El PDF lo denomina «sufijo impresivo» y dice que expresa sorpresa del hablante. <a href=\"#fuente-05\">C05, p. 11<\/a>.<\/p>\n<blockquote>\n<p><strong>Munaychamá kay llaqtaqa kasqa.<\/strong><br />\n<strong>Guía, traducción contextual:<\/strong> ¡Qué bonito resulta ser este pueblo!<\/p>\n<\/blockquote>\n<p>La exclamación española ayuda a representar el matiz señalado por la clase. No se ofrece como equivalencia literal de cada parte de <code>kasqa<\/code> ni como desarrollo de un nuevo tiempo verbal.<\/p>\n<p>Otros ejemplos impresos, sin traducción, son <code>Manamá chhaynachu karan<\/code>, <code>Ñishumá muhuqa<\/code> y <code>Manamá ripusqankichu<\/code>. Se conservan como material de lectura, con sus grafías originales.<\/p>\n<h3>7.9. <strong>-pas / -pis<\/strong>: también<\/h3>\n<p>Las dos formas tienen valor aditivo en el material. <a href=\"#fuente-05\">C05, p. 12<\/a>.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Quechua<\/th>\n  <th>Español<\/th>\n  <th>Origen<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>Qanpas llank'aq rinki.<\/code><\/td>\n  <td>Tú también irás a trabajar.<\/td>\n  <td>PDF.<\/td>\n<\/tr>\n<tr>\n  <td><code>Qankunapas tutamantan hatarinkichis.<\/code><\/td>\n  <td>Ustedes también se levantarán temprano.<\/td>\n  <td>Guía.<\/td>\n<\/tr>\n<tr>\n  <td><code>Noqapis paqarin lisas uchuta mikhusaq.<\/code><\/td>\n  <td>Yo también comeré mañana el plato de lisas con ají.<\/td>\n  <td>Guía contextual; se conserva la expresión mixta <code>lisas uchu<\/code>.<\/td>\n<\/tr>\n<tr>\n  <td><code>Mamaypas p'achata t'aqsanqa.<\/code><\/td>\n  <td>Mi madre también lavará la ropa.<\/td>\n  <td>Guía.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Aclaración editorial:<\/strong> la regla impresa «-pas con verbos / -pis con sustantivos y pronombres» contradice <code>qanpas<\/code> y <code>mamaypas<\/code>. El <a href=\"https://formacionenservicio.minedu.gob.pe/sifods/centro-recurso/2022/Material-educativo/750.018452-Item-9-manual-de-escritura-en-lengua-quechua-sureno-Baja.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">manual del Minedu<\/a> trata <code>-pis<\/code> como variante pronunciada de <code>-pas<\/code>. Aquí se preservan ambas grafías, sin esa división por categoría.<\/p>\n<h3>7.10. <strong>-cha<\/strong> y <strong>-chá<\/strong>: dos valores distintos<\/h3>\n<p>La tilde distingue dos formas que la lección contrapone explícitamente. <a href=\"#fuente-05\">C05, p. 13<\/a>.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Forma<\/th>\n  <th>Función del PDF<\/th>\n  <th>Ejemplo de clase<\/th>\n  <th>Español de la guía<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>-cha<\/code><\/td>\n  <td>Diminutivo o afectivo.<\/td>\n  <td><code>Haqay wallpacha michichawan pukllashan.<\/code><\/td>\n  <td>Aquella gallinita está jugando con el gatito.<\/td>\n<\/tr>\n<tr>\n  <td><code>-chá<\/code><\/td>\n  <td>Posibilidad o duda: quizá, tal vez.<\/td>\n  <td><code>Noqachá paqarin llank'amusaq.<\/code><\/td>\n  <td>Quizá yo trabaje mañana; glosa centrada en la posibilidad.<\/td>\n<\/tr>\n<tr>\n  <td><code>-chá<\/code><\/td>\n  <td>Posibilidad o duda.<\/td>\n  <td><code>Paykunachá Lima llaqtata ripunqaku.<\/code><\/td>\n  <td>Tal vez ellos se vayan a Lima.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>El diminutivo reaparece en la clase 6. No se debe eliminar la tilde de <code>-chá<\/code> al uniformar el documento.<\/p>\n<h3>7.11. Combinación <strong>-lla-ña<\/strong><\/h3>\n<p>La p. 6 reúne dos ejemplos bajo el rótulo <code>LLAÑA<\/code>, asociado a prioridad o exclusividad. Puede relacionarse con las explicaciones posteriores de <code>-lla<\/code> y <code>-ña<\/code>.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Quechua<\/th>\n  <th>Español del PDF, con redacción ajustada<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>Juanllaña tukuyruchun.<\/code><\/td>\n  <td>Que termine Juan nomás.<\/td>\n<\/tr>\n<tr>\n  <td><code>Michillaña mikhuchun.<\/code><\/td>\n  <td>Que ya coma el gato nomás.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>En estas oraciones aparecen formas de mandato que el curso usa como ejemplos, pero no conjuga sistemáticamente. La presente guía explica la combinación destacada y no completa un paradigma del imperativo. <a href=\"#fuente-05\">C05, p. 6<\/a>.<\/p>\n<p><a id=\"adjetivos\"><\/a><\/p>\n<h2>8. El adjetivo y sus clases<\/h2>\n<h3>8.1. Función: <strong>suti chaninchaq<\/strong><\/h3>\n<p>El adjetivo acompaña al sustantivo para expresar cualidades y precisar su significado. En los ejemplos de clase se coloca antes del nombre. <a href=\"#fuente-06\">C06, pp. 3-5<\/a>.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Grupo de la lección<\/th>\n  <th>Español del PDF<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>wajcha wawa<\/code><\/td>\n  <td>Niño huérfano.<\/td>\n<\/tr>\n<tr>\n  <td><code>yana alqo<\/code><\/td>\n  <td>Perro negro.<\/td>\n<\/tr>\n<tr>\n  <td><code>ch'iti wayna<\/code><\/td>\n  <td>Joven diligente.<\/td>\n<\/tr>\n<tr>\n  <td><code>llasa rumi<\/code><\/td>\n  <td>Piedra pesada.<\/td>\n<\/tr>\n<tr>\n  <td><code>ch'aku alqo<\/code><\/td>\n  <td>Perro peludo.<\/td>\n<\/tr>\n<tr>\n  <td><code>phiña warmi<\/code><\/td>\n  <td>Mujer renegona.<\/td>\n<\/tr>\n<tr>\n  <td><code>haya uchu<\/code><\/td>\n  <td>Ají picante.<\/td>\n<\/tr>\n<tr>\n  <td><code>sumaq aycha<\/code><\/td>\n  <td>Rica carne.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Las tablas siguientes conservan <strong>todas las correspondencias<\/strong> de las listas de cualidad, sabor, tamaño, cantidad y forma. Algunas glosas son sustantivos españoles o requieren revisión; se registran como vocabulario de la clase, sin convertir cada fila en una definición gramatical general.<\/p>\n<h3>8.2. Calidad: <strong>allinllata chaninchaq<\/strong><\/h3>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Quechua<\/th>\n  <th>Español del PDF<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>ch'uya<\/code><\/td>\n  <td>Limpio, claro, puro.<\/td>\n<\/tr>\n<tr>\n  <td><code>q'ata<\/code><\/td>\n  <td>Turbio.<\/td>\n<\/tr>\n<tr>\n  <td><code>qhelli<\/code><\/td>\n  <td>Sucio, impuro.<\/td>\n<\/tr>\n<tr>\n  <td><code>kusa<\/code><\/td>\n  <td>Magnífico, bueno, muy bueno.<\/td>\n<\/tr>\n<tr>\n  <td><code>allin<\/code><\/td>\n  <td>Bien, bueno.<\/td>\n<\/tr>\n<tr>\n  <td><code>sumaq<\/code><\/td>\n  <td>Rico, agradable.<\/td>\n<\/tr>\n<tr>\n  <td><code>millay<\/code><\/td>\n  <td>Feo, malo, desagradable.<\/td>\n<\/tr>\n<tr>\n  <td><code>wira<\/code><\/td>\n  <td>Grasa, sebo; el PDF imprime «cebo».<\/td>\n<\/tr>\n<tr>\n  <td><code>tullu<\/code><\/td>\n  <td>Delgado, flaco.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Fuente: <a href=\"#fuente-06\">C06, p. 6<\/a>. La glosa de <code>wira<\/code> es nominal, aunque la lista se titule «los que califican calidad»; se conserva esa diferencia.<\/p>\n<h3>8.3. Sabor: <strong>q'apaqe chaninchaq<\/strong><\/h3>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Quechua<\/th>\n  <th>Español del PDF<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>p'osqo<\/code><\/td>\n  <td>Agrio, fermentado.<\/td>\n<\/tr>\n<tr>\n  <td><code>q'ayma<\/code><\/td>\n  <td>Desabrido, sin sabor.<\/td>\n<\/tr>\n<tr>\n  <td><code>ch'apaq<\/code><\/td>\n  <td>Sin sal.<\/td>\n<\/tr>\n<tr>\n  <td><code>k'arku<\/code><\/td>\n  <td>Salado.<\/td>\n<\/tr>\n<tr>\n  <td><code>mishk'i<\/code><\/td>\n  <td>Dulce, agradable.<\/td>\n<\/tr>\n<tr>\n  <td><code>haja<\/code><\/td>\n  <td>Picante.<\/td>\n<\/tr>\n<tr>\n  <td><code>qhatqe / qhaqqe<\/code><\/td>\n  <td>Agrio, amargo, agridulce.<\/td>\n<\/tr>\n<tr>\n  <td><code>k'ayki<\/code><\/td>\n  <td>Agrio, picante.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Fuente: <a href=\"#fuente-06\">C06, p. 7<\/a>. Se mantienen <code>mishk'i<\/code> y <code>haja<\/code> en esta tabla, aunque otras páginas escriben <code>misk'i<\/code> y <code>haya<\/code>. La equivalencia de <code>p'osqo<\/code> se atribuye a esta lección; véase <a href=\"#revision-r10\">R10<\/a>.<\/p>\n<h3>8.4. Tamaño: <strong>sayaynin chaninchaq<\/strong><\/h3>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Quechua<\/th>\n  <th>Español del PDF<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>hatun<\/code><\/td>\n  <td>Grande, extenso.<\/td>\n<\/tr>\n<tr>\n  <td><code>taksa<\/code><\/td>\n  <td>Bajo, chico.<\/td>\n<\/tr>\n<tr>\n  <td><code>huch'uy<\/code><\/td>\n  <td>Pequeño.<\/td>\n<\/tr>\n<tr>\n  <td><code>rakhu<\/code><\/td>\n  <td>Grueso.<\/td>\n<\/tr>\n<tr>\n  <td><code>k'ikllu<\/code><\/td>\n  <td>Angosto.<\/td>\n<\/tr>\n<tr>\n  <td><code>ñañu<\/code><\/td>\n  <td>Delgado.<\/td>\n<\/tr>\n<tr>\n  <td><code>wask'a<\/code><\/td>\n  <td>Largo.<\/td>\n<\/tr>\n<tr>\n  <td><code>suyt'u<\/code><\/td>\n  <td>Largo.<\/td>\n<\/tr>\n<tr>\n  <td><code>t'usta<\/code><\/td>\n  <td>Pequeña.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Fuente: <a href=\"#fuente-06\">C06, p. 8<\/a>. Son las glosas de la lista: esta guía no supone que cada adjetivo equivalga a lo mismo en cualquier contexto.<\/p>\n<h3>8.5. Cantidad: <strong>ashkha chaninchaq<\/strong><\/h3>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Quechua<\/th>\n  <th>Español del PDF<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>llasa<\/code><\/td>\n  <td>Pesado.<\/td>\n<\/tr>\n<tr>\n  <td><code>askha<\/code><\/td>\n  <td>Harto.<\/td>\n<\/tr>\n<tr>\n  <td><code>pisi<\/code><\/td>\n  <td>Poco, menos.<\/td>\n<\/tr>\n<tr>\n  <td><code>aslla<\/code><\/td>\n  <td>Poco, suficiente.<\/td>\n<\/tr>\n<tr>\n  <td><code>sinchi<\/code><\/td>\n  <td>Mucho.<\/td>\n<\/tr>\n<tr>\n  <td><code>llasaq<\/code><\/td>\n  <td>Bastante.<\/td>\n<\/tr>\n<tr>\n  <td><code>chikan<\/code><\/td>\n  <td>Poquito.<\/td>\n<\/tr>\n<tr>\n  <td><code>wakin<\/code><\/td>\n  <td>Algunos.<\/td>\n<\/tr>\n<tr>\n  <td><code>nishu<\/code><\/td>\n  <td>Demasiado.<\/td>\n<\/tr>\n<tr>\n  <td><code>hunt'a<\/code><\/td>\n  <td>Lleno.<\/td>\n<\/tr>\n<tr>\n  <td><code>ch'usaq<\/code><\/td>\n  <td>Vacío.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Fuente: <a href=\"#fuente-06\">C06, p. 9<\/a>. El encabezado usa <code>ashkha<\/code>, mientras que la lista escribe <code>askha<\/code>; se conserva la diferencia. <code>llasa<\/code> y <code>llasaq<\/code> también se mantienen separados.<\/p>\n<h3>8.6. Forma: <strong>qhawariyninman hina chaninchaq<\/strong><\/h3>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Quechua<\/th>\n  <th>Español del PDF<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>muyu<\/code><\/td>\n  <td>Redondo.<\/td>\n<\/tr>\n<tr>\n  <td><code>p'alta<\/code><\/td>\n  <td>Plano.<\/td>\n<\/tr>\n<tr>\n  <td><code>tawqa / qoto<\/code><\/td>\n  <td>Montón.<\/td>\n<\/tr>\n<tr>\n  <td><code>qhonpo<\/code><\/td>\n  <td>Motoso.<\/td>\n<\/tr>\n<tr>\n  <td><code>qhasqa<\/code><\/td>\n  <td>Áspero.<\/td>\n<\/tr>\n<tr>\n  <td><code>llaphlla<\/code><\/td>\n  <td>Laminado.<\/td>\n<\/tr>\n<tr>\n  <td><code>lunp'u<\/code><\/td>\n  <td>Esférico.<\/td>\n<\/tr>\n<tr>\n  <td><code>sarpha<\/code><\/td>\n  <td>Escama.<\/td>\n<\/tr>\n<tr>\n  <td><code>k'awchi<\/code><\/td>\n  <td>Puntiagudo.<\/td>\n<\/tr>\n<tr>\n  <td><code>llanp'u<\/code><\/td>\n  <td>Suave.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Fuente: <a href=\"#fuente-06\">C06, p. 10<\/a>. Las glosas «montón» y «escama» se conservan como aparecen; requieren contexto para convertirlas en descripciones de una oración concreta.<\/p>\n<p><a id=\"numerales\"><\/a><\/p>\n<h2>9. Numerales, frecuencia, conjuntos y procedencia<\/h2>\n<h3>9.1. Cardinales: cuántos<\/h3>\n<p>Los <strong>yupay suti chaninchaqkuna<\/strong> expresan cantidad. La lista de esta lección usa <code>esqon<\/code> para nueve. <a href=\"#fuente-06\">C06, p. 11<\/a>.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Quechua<\/th>\n  <th>Español<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>huk<\/code><\/td>\n  <td>Uno.<\/td>\n<\/tr>\n<tr>\n  <td><code>iskay<\/code><\/td>\n  <td>Dos.<\/td>\n<\/tr>\n<tr>\n  <td><code>kinsa<\/code><\/td>\n  <td>Tres.<\/td>\n<\/tr>\n<tr>\n  <td><code>tawa<\/code><\/td>\n  <td>Cuatro.<\/td>\n<\/tr>\n<tr>\n  <td><code>pisqa<\/code><\/td>\n  <td>Cinco.<\/td>\n<\/tr>\n<tr>\n  <td><code>soqta<\/code><\/td>\n  <td>Seis.<\/td>\n<\/tr>\n<tr>\n  <td><code>qanchis<\/code><\/td>\n  <td>Siete.<\/td>\n<\/tr>\n<tr>\n  <td><code>pusaq<\/code><\/td>\n  <td>Ocho.<\/td>\n<\/tr>\n<tr>\n  <td><code>esqon<\/code><\/td>\n  <td>Nueve.<\/td>\n<\/tr>\n<tr>\n  <td><code>chunka<\/code><\/td>\n  <td>Diez.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Como ejemplo de numeral junto a un sustantivo, el repaso usa <code>iskay runtuta<\/code>, «dos huevos», dentro de la oración sobre la gallina. <a href=\"#fuente-03\">C03, p. 13<\/a>.<\/p>\n<p>La página de apoyo a lectura y escritura contiene además un <strong>diagrama<\/strong>, no extraíble como texto, que agrupa <strong>987 | 654 | 352<\/strong>, con los rótulos <code>hunu<\/code>, <code>waranqa<\/code>, <code>pachak<\/code>, <code>chunka<\/code>, <code>niyuq/yuq<\/code>. Se registra su función de apoyo numérico; no se fabrica una escritura completa que la lámina no ofrece. <a href=\"#fuente-02\">C02, p. 4<\/a>.<\/p>\n<h3>9.2. Ordinales: qué lugar ocupa<\/h3>\n<p>Los <strong>qati qati suti chaninchaqkuna<\/strong> expresan orden. El patrón de la tabla es <strong>número + ñeqe<\/strong>. <a href=\"#fuente-06\">C06, p. 12<\/a>.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Quechua de la tabla<\/th>\n  <th>Español del PDF<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>huk ñeqe<\/code><\/td>\n  <td>Primero.<\/td>\n<\/tr>\n<tr>\n  <td><code>iskay ñeqe<\/code><\/td>\n  <td>Segundo.<\/td>\n<\/tr>\n<tr>\n  <td><code>kinsa ñeqe<\/code><\/td>\n  <td>Tercero.<\/td>\n<\/tr>\n<tr>\n  <td><code>tawa ñeqe<\/code><\/td>\n  <td>Cuarto.<\/td>\n<\/tr>\n<tr>\n  <td><code>pisqa ñeqe<\/code><\/td>\n  <td>Quinto.<\/td>\n<\/tr>\n<tr>\n  <td><code>soqta ñeqe<\/code><\/td>\n  <td>Sexto.<\/td>\n<\/tr>\n<tr>\n  <td><code>qanchis ñeqe<\/code><\/td>\n  <td>Séptimo.<\/td>\n<\/tr>\n<tr>\n  <td><code>pusaq ñeqe<\/code><\/td>\n  <td>Octavo.<\/td>\n<\/tr>\n<tr>\n  <td><code>esqon ñeqe<\/code><\/td>\n  <td>Noveno.<\/td>\n<\/tr>\n<tr>\n  <td><code>chunka ñeqe<\/code><\/td>\n  <td>Décimo.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>La misma página añade <code>wakataraq<\/code>, «primero la vaca», y <code>tawa ñeqeman qatiq<\/code>, «el que le sigue al cuarto». La primera expresa prioridad en la glosa, pero no tiene la misma construcción de <strong>número + ñeqe<\/strong>; la segunda incorpora un ordinal dentro de una expresión mayor.<\/p>\n<h3>9.3. Frecuencia con <strong>kuti<\/strong><\/h3>\n<p>La clase usa el título «números proporcionales». Las traducciones muestran, en concreto, <strong>número de veces o frecuencia<\/strong>. <a href=\"#fuente-06\">C06, p. 13<\/a>.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Quechua<\/th>\n  <th>Español del PDF<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>huk kuti<\/code><\/td>\n  <td>Una vez.<\/td>\n<\/tr>\n<tr>\n  <td><code>iskay kuti<\/code><\/td>\n  <td>Dos veces.<\/td>\n<\/tr>\n<tr>\n  <td><code>kinsa kuti<\/code><\/td>\n  <td>Tres veces.<\/td>\n<\/tr>\n<tr>\n  <td><code>tawa kuti<\/code><\/td>\n  <td>Cuatro veces.<\/td>\n<\/tr>\n<tr>\n  <td><code>pisqa kuti<\/code><\/td>\n  <td>Cinco veces.<\/td>\n<\/tr>\n<tr>\n  <td><code>sapa kuti<\/code><\/td>\n  <td>Cada vez.<\/td>\n<\/tr>\n<tr>\n  <td><code>pasaq kuti<\/code><\/td>\n  <td>Varias veces; forma del PDF por confirmar.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Para este contenido, <strong>kuti<\/strong> permite distinguir «tres» de «tres veces». <code>Sapa<\/code> se escribe como palabra en <code>sapa kuti<\/code>, «cada vez»; se distingue de la posición de sufijo en <code>qolqe-sapa<\/code>, «adinerado», de la sección 10. No se añaden reglas de proporciones, fracciones o multiplicación que no se desarrollan en las diapositivas.<\/p>\n<h3>9.4. Numerales colectivos: <strong>-ntin / -nintin<\/strong><\/h3>\n<p>Los <strong>huñuq yupay suti chaninchaqkuna<\/strong> presentan a los integrantes como un conjunto: «los cuatro», «los dos», etc. Los ejemplos permiten reconocer <code>-ntin<\/code> tras las bases vocálicas mostradas y <code>-nintin<\/code> tras las consonánticas mostradas. <a href=\"#fuente-06\">C06, p. 15<\/a>.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Forma de clase<\/th>\n  <th>Segmentación de la guía<\/th>\n  <th>Español del PDF<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>soqtantin<\/code><\/td>\n  <td><code>soqta-ntin<\/code><\/td>\n  <td>Los o las seis.<\/td>\n<\/tr>\n<tr>\n  <td><code>tawantin<\/code><\/td>\n  <td><code>tawa-ntin<\/code><\/td>\n  <td>Los o las cuatro.<\/td>\n<\/tr>\n<tr>\n  <td><code>iskaynintin<\/code><\/td>\n  <td><code>iskay-nintin<\/code><\/td>\n  <td>Los o las dos.<\/td>\n<\/tr>\n<tr>\n  <td><code>qanchisnintin<\/code><\/td>\n  <td><code>qanchis-nintin<\/code><\/td>\n  <td>Los o las siete.<\/td>\n<\/tr>\n<tr>\n  <td><code>esqonnintin<\/code><\/td>\n  <td><code>esqon-nintin<\/code><\/td>\n  <td>Los o las nueve.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Este grupo no debe confundirse con el sustantivo colectivo <code>ayllu<\/code>: una cosa es nombrar un conjunto con una palabra y otra agrupar a un número de integrantes mediante estas formas.<\/p>\n<h3>9.5. Procedencia: los llamados «adjetivos gentilicios»<\/h3>\n<p>La lección reúne bajo <strong>k'itichaq suti chaninchaqkuna<\/strong> tanto gentilicios de personas como expresiones de origen de plantas o animales. <a href=\"#fuente-06\">C06, p. 15<\/a>.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Quechua<\/th>\n  <th>Español del PDF<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>Qosqo runa<\/code><\/td>\n  <td>Cusqueño.<\/td>\n<\/tr>\n<tr>\n  <td><code>Qosqorunakuna<\/code><\/td>\n  <td>Cusqueños.<\/td>\n<\/tr>\n<tr>\n  <td><code>yunka sach'a<\/code><\/td>\n  <td>Arbusto de la selva.<\/td>\n<\/tr>\n<tr>\n  <td><code>puna p'aqocha<\/code><\/td>\n  <td>Alpaca de la puna.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Se observa el nombre del lugar o ámbito antes del nombre principal. La tabla escribe <code>Qosqo runa<\/code> separado y <code>Qosqorunakuna<\/code> unido; se conserva esa diferencia y no se toma como una regla general de separación de palabras.<\/p>\n<p><a id=\"derivacion\"><\/a><\/p>\n<h2>10. Abundancia, aumentativos y diminutivos<\/h2>\n<h3>10.1. <strong>-sapa<\/strong>: tamaño destacado o abundancia<\/h3>\n<p>La lección lo presenta en la sección de aumentativos. Sus ejemplos indican una parte grande o la posesión abundante de algo. <a href=\"#fuente-06\">C06, p. 16<\/a>.<\/p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Forma<\/th>\n  <th>Segmentación para estudiar<\/th>\n  <th>Español del PDF<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>simisapa<\/code><\/td>\n  <td><code>simi-sapa<\/code><\/td>\n  <td>De boca grande, bocón o bocona.<\/td>\n<\/tr>\n<tr>\n  <td><code>wiksasapa<\/code><\/td>\n  <td><code>wiksa-sapa<\/code><\/td>\n  <td>De barriga grande, barrigón o barrigona.<\/td>\n<\/tr>\n<tr>\n  <td><code>ñawisapa<\/code><\/td>\n  <td><code>ñawi-sapa<\/code><\/td>\n  <td>De ojos grandes, ojón u ojona.<\/td>\n<\/tr>\n<tr>\n  <td><code>qolqesapa<\/code><\/td>\n  <td><code>qolqe-sapa<\/code><\/td>\n  <td>Que posee mucho dinero, adinerado o adinerada.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>El último ejemplo permite evitar la traducción mecánica «dinero grande»: en él se destaca <strong>abundancia de dinero<\/strong>.<\/p>\n<h3>10.2. <strong>-cha<\/strong>: diminutivo y afecto<\/h3>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n  <th>Forma del PDF<\/th>\n  <th>Segmentación para estudiar<\/th>\n  <th>Español del PDF<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td><code>alqocha<\/code><\/td>\n  <td><code>alqo-cha<\/code><\/td>\n  <td>Perrito.<\/td>\n<\/tr>\n<tr>\n  <td><code>Juancha<\/code><\/td>\n  <td><code>Juan-cha<\/code><\/td>\n  <td>Juancito.<\/td>\n<\/tr>\n<tr>\n  <td><code>mallkicha<\/code><\/td>\n  <td><code>mallki-cha<\/code><\/td>\n  <td>Arbolito.<\/td>\n<\/tr>\n<tr>\n  <td><code>michicha<\/code><\/td>\n  <td><code>michi-cha<\/code><\/td>\n  <td>Gatito.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Fuente: <a href=\"#fuente-06\">C06, p. 16<\/a>. El uso afectivo también se explica en <a href=\"#fuente-05\">C05, p. 13<\/a>, y los nombres personales con esta terminación aparecen en <a href=\"#fuente-03\">C03, p. 4<\/a>. <strong>-cha<\/strong> diminutivo se distingue de <strong>-chá<\
